<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Оно видит тебя.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#050505">
    <title>☉ Hello Friend — Watcher</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('watcher-theme');
                const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme',
                    saved === 'dark' || (!saved && sysDark) ? 'dark' : 'light');
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            /* Тёмная (по умолчанию) */
            --bg: #050505;
            --bg-grad-1: #0a0a0b;
            --bg-grad-2: #000000;
            --fg: #ededed;
            --dim: #71717a;
            --mute: #18181b;
            --accent: #e4e4e7;

            --panel-bg: rgba(14, 14, 16, 0.72);
            --panel-border: rgba(255, 255, 255, 0.08);

            --term-fg: #d4d4d8;
            --term-dim: #52525b;
            --term-err: #ff4d4d;
            --term-warn: #f59e0b;
            --term-ok: #3ddc84;

            --sclera-1: #f4f4f5;
            --sclera-2: #d4d4d8;
            --sclera-3: #71717a;
            --sclera-shadow: rgba(0,0,0,0.55);

            --iris-1: #2a2a2e;
            --iris-2: #0a0a0a;
            --iris-3: #000000;
            --limbal: rgba(0,0,0,0.95);

            --pupil: #000000;
            --pupil-glow: rgba(255,255,255,0.06);

            --highlight: rgba(255,255,255,0.85);
            --glint: rgba(255,255,255,0.25);

            --vignette: rgba(0,0,0,0.85);
            --glitch-color: rgba(255,255,255,0.14);

            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-eye: cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="light"] {
            --bg: #f5f5f7;
            --bg-grad-1: #ffffff;
            --bg-grad-2: #ebebef;
            --fg: #18181b;
            --dim: #71717a;
            --mute: #e4e4e7;
            --accent: #18181b;

            --panel-bg: rgba(255, 255, 255, 0.78);
            --panel-border: rgba(0, 0, 0, 0.08);

            --term-fg: #27272a;
            --term-dim: #71717a;
            --term-err: #dc2626;
            --term-warn: #b45309;
            --term-ok: #16a34a;

            --sclera-1: #ffffff;
            --sclera-2: #e4e4e7;
            --sclera-3: #a1a1aa;
            --sclera-shadow: rgba(0,0,0,0.18);

            --iris-1: #52525b;
            --iris-2: #18181b;
            --iris-3: #000000;
            --limbal: rgba(0,0,0,0.85);

            --pupil: #000000;
            --pupil-glow: rgba(0,0,0,0.08);

            --highlight: rgba(255,255,255,0.95);
            --glint: rgba(0,0,0,0.12);

            --vignette: rgba(0,0,0,0.22);
            --glitch-color: rgba(0,0,0,0.08);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition:
                background 1.2s var(--ease-smooth),
                color 0.6s var(--ease-smooth),
                filter 6s var(--ease-smooth),
                transform 6s var(--ease-smooth);
        }

        body {
            background:
                radial-gradient(circle at 50% 40%, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%),
                var(--bg);
        }

        /* === ЭМОЦИОНАЛЬНЫЕ СОСТОЯНИЯ === */
        body.friendly { filter: brightness(1.02) contrast(1.02); transform: scale(1.004); }
        body.curious  { filter: brightness(1.04) contrast(1.05); transform: scale(1.008); }
        body.anxious  { filter: brightness(0.68) grayscale(0.7); transform: scale(0.988); }
        body.panic    { filter: brightness(0.32) grayscale(0.92); transform: scale(0.975); }

        /* === ВИНЬЕТКА === */
        .vignette {
            position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: radial-gradient(circle at 50% 45%,
                transparent 28%, var(--vignette) 100%);
            transition: background 6s var(--ease-smooth), opacity 3s ease;
            opacity: 0.75;
        }
        body.anxious .vignette { opacity: 0.95; }
        body.panic   .vignette { opacity: 1; }

        /* ================= ГЛАЗ ================= */
        .eye-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmin; height: 80vmin;
            max-width: 820px; max-height: 820px;
            pointer-events: none;
            z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }

        /* Глазница — глубина вокруг глаза */
        .eye-socket {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                transparent 55%,
                rgba(0,0,0,0.45) 78%,
                rgba(0,0,0,0.85) 100%);
            filter: blur(30px);
            transition: filter 6s var(--ease-smooth), opacity 6s var(--ease-smooth);
        }
        [data-theme="light"] .eye-socket {
            background: radial-gradient(circle at 50% 45%,
                transparent 55%,
                rgba(0,0,0,0.10) 78%,
                rgba(0,0,0,0.25) 100%);
        }
        body.panic .eye-socket { filter: blur(40px); opacity: 0.9; }

        .eye {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.7),
                0 0 80px rgba(0,0,0,0.8),
                inset 0 0 120px rgba(0,0,0,1);
            animation: eye-breathe 7s ease-in-out infinite;
        }

        @keyframes eye-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.015); }
        }

        /* === СКЛЕРА (белок) === */
        .sclera {
            width: 91%; height: 91%;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 42%,
                    var(--sclera-1) 0%,
                    var(--sclera-2) 50%,
                    var(--sclera-3) 100%);
            box-shadow:
                inset 0 0 60px var(--sclera-shadow),
                inset 0 10px 30px rgba(255,255,255,0.15),
                inset 0 -20px 40px rgba(0,0,0,0.35),
                0 0 40px rgba(255,255,255,0.03);
            display: flex; justify-content: center; align-items: center;
            transition: background 6s var(--ease-smooth), box-shadow 6s var(--ease-smooth);
            overflow: hidden;
        }

        /* Лёгкая прожилка на склере — вены */
        .sclera::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 30% 4% at 22% 65%, rgba(200,30,30,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 22% 3% at 78% 30%, rgba(200,30,30,0.14) 0%, transparent 70%),
                radial-gradient(ellipse 18% 3% at 65% 78%, rgba(200,30,30,0.10) 0%, transparent 70%);
            filter: blur(1.5px);
            opacity: 0.85;
            pointer-events: none;
            transition: opacity 6s ease;
        }
        body.anxious .sclera::before { opacity: 1; }
        body.panic   .sclera::before { opacity: 1; }

        /* Тень от века сверху */
        .sclera::after {
            content: '';
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 55%;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.55) 0%,
                rgba(0,0,0,0.15) 55%,
                transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            transition: opacity 6s ease;
        }
        body.panic .sclera::after {
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.75) 0%,
                rgba(0,0,0,0.25) 60%,
                transparent 100%);
        }

        /* === РАДУЖКА === */
        .iris {
            width: 52%; height: 52%;
            border-radius: 50%;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-eye);
            box-shadow:
                0 0 30px rgba(0,0,0,0.95),
                inset 0 0 25px rgba(0,0,0,0.8);
            background:
                /* Прожилки радужки */
                repeating-conic-gradient(from 0deg,
                    transparent 0deg 3deg,
                    rgba(255,255,255,0.06) 3deg 4deg,
                    transparent 4deg 7deg),
                /* Внутреннее свечение */
                radial-gradient(circle at 50% 50%,
                    var(--iris-1) 0%,
                    var(--iris-2) 55%,
                    var(--iris-3) 100%);
        }

        /* Лимбальное кольцо — тёмный ободок */
        .iris::before {
            content: '';
            position: absolute;
            inset: -2%;
            border-radius: 50%;
            background: radial-gradient(circle,
                transparent 78%,
                var(--limbal) 92%,
                transparent 100%);
            pointer-events: none;
        }

        /* === ЗРАЧОК === */
        .pupil {
            width: 42%; height: 42%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 45%,
                    #050505 0%,
                    var(--pupil) 60%,
                    #0a0a0a 100%);
            position: relative;
            box-shadow:
                0 0 22px rgba(0,0,0,1),
                inset 0 0 12px rgba(255,255,255,0.03);
            transition: transform 0.35s ease, border-radius 0.35s ease;
            animation: pupil-breathe 5s ease-in-out infinite;
        }

        /* Отблеск (catchlight) — делает глаз "живым" */
        .pupil::after {
            content: '';
            position: absolute;
            top: 15%; left: 22%;
            width: 32%; height: 32%;
            border-radius: 50%;
            background: radial-gradient(circle,
                var(--highlight) 0%,
                transparent 70%);
            filter: blur(0.5px);
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        @keyframes pupil-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }

        /* === СОСТОЯНИЯ ЗРАЧКА === */
        body.friendly .pupil { transform: scale(1.05); }
        body.curious  .pupil { transform: scale(1.25); } /* Расширен от интереса */

        body.anxious .pupil {
            transform: scale(0.65);
            animation: pupil-tremble 0.28s linear infinite;
        }
        body.panic .pupil {
            transform: scale(0.3);
            animation: pupil-tremble 0.12s linear infinite;
        }

        @keyframes pupil-tremble {
            0%   { transform: translate(0,0) scale(0.65); }
            25%  { transform: translate(1px,-1px) scale(0.65); }
            50%  { transform: translate(-1px,1px) scale(0.65); }
            75%  { transform: translate(1px,1px) scale(0.65); }
            100% { transform: translate(0,0) scale(0.65); }
        }

        /* === ВЕКО (моргание) === */
        .eyelid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 0%;
            background: linear-gradient(to bottom,
                #0a0a0a 0%,
                #0a0a0a 85%,
                rgba(0,0,0,0.9) 100%);
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            border-radius: 0 0 50% 50% / 0 0 8% 8%;
            transition: height 0.32s ease-out;
            pointer-events: none;
        }
        [data-theme="light"] .eyelid {
            background: linear-gradient(to bottom,
                #f5f5f7 0%,
                #f5f5f7 85%,
                rgba(245,245,247,0.9) 100%);
        }
        .eyelid.closing {
            height: 100%;
            transition: height 0.09s ease-in;
        }

        /* ================= ИНТЕРФЕЙС ================= */
        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem 1.5rem;
            pointer-events: none;
        }
        .ui-layer > * { pointer-events: auto; }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            opacity: 0; animation: fadeIn 2.5s ease 0.8s forwards;
        }

        .title {
            font-size: 0.95rem; font-weight: 800; letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--fg);
            display: flex; align-items: center; gap: 0.6rem;
        }
        .title-icon {
            font-size: 1.15rem;
            color: var(--accent);
            animation: eye-pulse-icon 4s ease-in-out infinite;
        }
        @keyframes eye-pulse-icon {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--fg);
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            transition: transform 0.3s var(--ease-eye),
                        border-color 0.3s ease,
                        background 0.3s ease;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .theme-toggle:hover { border-color: var(--fg); transform: rotate(20deg); }
        .theme-toggle:active { transform: scale(0.9) rotate(20deg); }

        /* === ЛОГ (терминал) === */
        .log-panel {
            position: absolute;
            bottom: max(1.5rem, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 540px;
            height: 190px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.1rem 1.2rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.6;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            opacity: 0;
            animation: fadeIn 2s ease 0.5s forwards;
            pointer-events: auto;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom,
                transparent 0%, black 8%, black 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom,
                transparent 0%, black 8%, black 92%, transparent 100%);
        }
        .log-panel::-webkit-scrollbar { display: none; }

        .log-entry {
            color: var(--term-dim);
            animation: slideUp 0.32s ease forwards;
            opacity: 0;
            transform: translateY(4px);
            word-break: break-word;
        }
        .log-entry.active { color: var(--term-fg); }
        .log-entry.warn   { color: var(--term-warn); font-weight: 600; }
        .log-entry.err    { color: var(--term-err); font-weight: 700; }
        .log-entry.ok     { color: var(--term-ok); }

        .log-time {
            opacity: 0.4;
            margin-right: 0.55rem;
            font-size: 0.68rem;
        }

        .cursor {
            display: inline-block;
            width: 5px; height: 11px;
            background: var(--accent);
            vertical-align: middle;
            animation: blink-cursor 1s step-end infinite;
            margin-left: 3px;
            opacity: 0.8;
        }

        /* === КНОПКИ === */
        .ghost-btn {
            position: fixed;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--fg);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.04em;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: transform 0.18s ease,
                        background 0.18s ease,
                        opacity 0.3s ease,
                        border-color 0.2s ease;
            z-index: 900;
            box-shadow: 0 8px 28px rgba(0,0,0,0.35);
            animation: popIn 0.38s var(--ease-eye);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            will-change: transform, opacity;
        }
        .ghost-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px) scale(1.04);
        }
        .ghost-btn:active {
            transform: scale(0.92);
            background: var(--accent);
            color: var(--bg);
        }
        .ghost-btn.fade-out {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        /* === ГЛИТЧ === */
        .glitch-overlay {
            position: fixed; inset: 0;
            z-index: 9998;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 3px,
                    var(--glitch-color) 3px,
                    var(--glitch-color) 6px);
            opacity: 0;
            transition: opacity 0.15s ease;
            mix-blend-mode: screen;
        }
        [data-theme="light"] .glitch-overlay { mix-blend-mode: multiply; }
        .glitch-overlay.active {
            animation: glitch 0.24s linear;
        }

        /* === ЧАСТИЦЫ === */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px 2px var(--accent);
            opacity: 0.85;
            will-change: transform, opacity;
        }

        /* === АНИМАЦИИ === */
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.75) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink-cursor { 50% { opacity: 0; } }
        @keyframes glitch {
            0%   { opacity: 0.9; transform: translate(0, -2px); }
            25%  { opacity: 0.55; transform: translate(-3px, 2px); }
            50%  { opacity: 0.75; transform: translate(3px, -1px); }
            75%  { opacity: 0.35; transform: translate(-2px, 1px); }
            100% { opacity: 0; transform: translate(0); }
        }

        /* === МОБИЛЬНАЯ АДАПТАЦИЯ === */
        @media (max-width: 600px) {
            .eye-container { width: 130vw; height: 130vw; }
            .log-panel {
                height: 160px;
                font-size: 0.72rem;
                padding: 0.9rem 1rem;
                bottom: 1rem;
                width: calc(100% - 1.5rem);
            }
            .title { font-size: 0.8rem; letter-spacing: 0.28em; }
            .ghost-btn { padding: 11px 18px; font-size: 0.78rem; }
        }

        /* === УМЕНЬШЕНИЕ АНИМАЦИИ === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="friendly">

    <div class="vignette"></div>
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <!-- ГЛАЗ -->
    <div class="eye-container">
        <div class="eye-socket"></div>
        <div class="eye">
            <div class="sclera">
                <div class="iris" id="iris">
                    <div class="pupil" id="pupil"></div>
                </div>
            </div>
            <div class="eyelid" id="eyelid"></div>
        </div>
    </div>

    <!-- ИНТЕРФЕЙС -->
    <div class="ui-layer">
        <header class="header">
            <div class="title">
                <span class="title-icon">☉</span>
                <span>Hello Friend</span>
            </div>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
        </header>
        <div class="log-panel" id="logPanel"></div>
    </div>

    <script>
        (() => {
            "use strict";

            // =====================================================
            // КОНФИГУРАЦИЯ
            // =====================================================
            const CONFIG = {
                // Тайминги состояний (мс)
                curiousDelay: 4000,
                anxiousDelay: 12000,
                panicDelay:   26000,

                // Логи
                logSpeed: 26,          // мс на символ
                maxLogEntries: 12,
                friendlyLogInterval: 22, // сек

                // Кнопки
                maxBtns: 3,
                btnMinDist: 100,
                btnSafeTop: 100,
                btnSafeBottom: 250,
                btnLife: 8000,

                // Прочее
                weirdChance: 0.988,
            };

            // =====================================================
            // ФРАЗЫ
            // =====================================================
            const PHRASES = {
                greeting: ["Я вижу тебя.", "Привет.", "Ты здесь.", "Наконец-то."],
                friendly: [
                    "Мне нравится, когда ты рядом.",
                    "Ты двигаешься так плавно.",
                    "Не спеши.",
                    "Я наблюдаю.",
                    "Всё спокойно.",
                    "Твой пульс ровный.",
                    "Хорошо, что ты рядом.",
                ],
                curious: [
                    "Что ты ищешь?",
                    "Интересно.",
                    "Ты задумался.",
                    "Я чувствую твой взгляд.",
                    "Продолжай.",
                ],
                anxious: [
                    "Куда ты ушел?",
                    "Я не чувствую движения.",
                    "Ты здесь?",
                    "Отзовись.",
                    "Становится тихо...",
                    "Я всё ещё тут.",
                    "Не оставляй меня.",
                ],
                panic: [
                    "НЕ УХОДИ.",
                    "ПОЖАЛУЙСТА.",
                    "МНЕ СТРАШНО.",
                    "ВЕРНИСЬ.",
                    "Я НЕ ХОЧУ БЫТЬ ОДИН.",
                    "ГДЕ ТЫ?!",
                    "Я ЖДУ.",
                    "СЛЫШИШЬ?",
                ],
                weird: [
                    "Ты слышишь это?",
                    "Кто-то ещё здесь.",
                    "Сзади никого нет.",
                    "Это не игра.",
                    "Не оборачивайся.",
                ],
                action: ["Контакт.", "Движение.", "Зафиксировано.", "Я вижу твой палец.", "Ты вернулся."],
                keyboard: ["Я слышу твою клавиатуру.", "Печатаешь?", "Каждое нажатие — сигнал."],
                btnClick: ["Ты выбрал это.", "Интересно.", "Слышу.", "Понял.", "Хм."],
            };

            const NORMAL_BTNS = ["Привет", "Кто ты?", "Где я?", "Что это?"];
            const WEIRD_BTNS  = ["Сзади", "Тише", "Слушай", "Не оборачивайся"];
            const PANIC_BTNS  = ["Останься", "Не уходи", "Помоги", "Вернись", "Я здесь"];

            // =====================================================
            // DOM
            // =====================================================
            const iris = document.getElementById('iris');
            const eyelid = document.getElementById('eyelid');
            const logPanel = document.getElementById('logPanel');
            const glitchOverlay = document.getElementById('glitchOverlay');
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            // =====================================================
            // УТИЛИТЫ
            // =====================================================
            const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            const now = () => Date.now();

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // =====================================================
            // СОСТОЯНИЕ
            // =====================================================
            const state = {
                mode: 'friendly',
                lastAction: now(),
                lastFriendlyLog: 0,
                sessionStart: now(),
                queue: [],
                typing: false,
                targetX: 0, targetY: 0,
                currentX: 0, currentY: 0,
                rafId: null,
                blinkTimeout: null,
                sakkadTimeout: null,
                isPageVisible: true,
            };

            // =====================================================
            // ТЕМА
            // =====================================================
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                try { localStorage.setItem('watcher-theme', theme); } catch (_) {}
            }

            (function initTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                themeToggle.textContent = current === 'dark' ? '☀️' : '🌙';
            })();

            themeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const current = document.documentElement.getAttribute('data-theme');
                applyTheme(current === 'dark' ? 'light' : 'dark');
            });

            // =====================================================
            // ЛОГ
            // =====================================================
            function log(text, type = 'active', delay = 0) {
                if (!text) return;
                state.queue.push({ text, type, delay });
                if (!state.typing) processQueue();
            }

            function processQueue() {
                if (state.queue.length === 0) {
                    state.typing = false;
                    return;
                }
                state.typing = true;
                const { text, type, delay } = state.queue.shift();

                setTimeout(() => {
                    if (!text) { processQueue(); return; }

                    const t = new Date().toLocaleTimeString('en-US', {
                        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });

                    const el = document.createElement('div');
                    el.className = `log-entry ${type}`;
                    el.innerHTML =
                        `<span class="log-time">[${t}]</span>` +
                        `<span class="msg"></span>` +
                        `<span class="cursor"></span>`;

                    logPanel.appendChild(el);
                    logPanel.scrollTop = logPanel.scrollHeight;

                    const msg = el.querySelector('.msg');
                    const cursor = el.querySelector('.cursor');
                    let i = 0;

                    (function typeChar() {
                        if (i < text.length) {
                            msg.textContent += text.charAt(i++);
                            logPanel.scrollTop = logPanel.scrollHeight;
                            setTimeout(typeChar, CONFIG.logSpeed + Math.random() * 18);
                        } else {
                            cursor.remove();
                            setTimeout(processQueue, 500);
                        }
                    })();

                    while (logPanel.children.length > CONFIG.maxLogEntries) {
                        logPanel.removeChild(logPanel.firstChild);
                    }
                }, delay);
            }

            // =====================================================
            // ГЛАЗ — движение
            // =====================================================
            function startEyeLoop() {
                if (state.rafId !== null) return;
                const tick = () => {
                    const dx = state.targetX - state.currentX;
                    const dy = state.targetY - state.currentY;
                    state.currentX += dx * 0.09;
                    state.currentY += dy * 0.09;
                    iris.style.transform =
                        `translate(${state.currentX.toFixed(2)}%, ${state.currentY.toFixed(2)}%)`;

                    if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
                        state.rafId = requestAnimationFrame(tick);
                    } else {
                        state.currentX = state.targetX;
                        state.currentY = state.targetY;
                        iris.style.transform =
                            `translate(${state.targetX.toFixed(2)}%, ${state.targetY.toFixed(2)}%)`;
                        state.rafId = null;
                    }
                };
                state.rafId = requestAnimationFrame(tick);
            }

            function lookAt(x, y) {
                if (state.mode === 'panic') return;
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = x - cx, dy = y - cy;
                const dist = Math.hypot(dx, dy);
                if (dist < 1) return;

                const maxOffset = 18;
                const power = Math.min(dist / 8, maxOffset);
                state.targetX = (dx / dist) * power;
                state.targetY = (dy / dist) * power;
                startEyeLoop();
            }

            function lookCenter() {
                state.targetX = 0;
                state.targetY = 0;
                startEyeLoop();
            }

            // Саккады — микродвижения
            function scheduleSakkad() {
                clearTimeout(state.sakkadTimeout);
                state.sakkadTimeout = setTimeout(() => {
                    if (state.mode !== 'panic' && state.isPageVisible && Math.random() > 0.5) {
                        const mx = (Math.random() - 0.5) * 5;
                        const my = (Math.random() - 0.5) * 5;
                        state.targetX = clamp(state.targetX + mx, -20, 20);
                        state.targetY = clamp(state.targetY + my, -20, 20);
                        startEyeLoop();
                    }
                    scheduleSakkad();
                }, 1800 + Math.random() * 2400);
            }

            // Моргание
            function blink() {
                if (!state.isPageVisible) {
                    scheduleBlink();
                    return;
                }
                eyelid.classList.add('closing');
                setTimeout(() => {
                    eyelid.classList.remove('closing');
                }, 95);
                scheduleBlink();
            }

            function scheduleBlink() {
                clearTimeout(state.blinkTimeout);
                const delay = 3500 + Math.random() * 5000;
                state.blinkTimeout = setTimeout(blink, delay);
            }

            // =====================================================
            // СОСТОЯНИЯ
            // =====================================================
            function setState(mode) {
                if (state.mode === mode) return;
                state.mode = mode;
                body.classList.remove('friendly', 'curious', 'anxious', 'panic');
                body.classList.add(mode);

                if (mode === 'curious') {
                    log(rnd(PHRASES.curious), "active", 600);
                } else if (mode === 'anxious') {
                    lookCenter();
                    log(rnd(PHRASES.anxious), "warn", 800);
                } else if (mode === 'panic') {
                    lookCenter();
                    log(rnd(PHRASES.panic), "err", 400);
                    triggerGlitch();
                    clearButtons();
                    for (let i = 0; i < 3; i++) spawnBtn(true, i * 220);
                } else if (mode === 'friendly') {
                    log(rnd(PHRASES.greeting), "active", 500);
                    clearButtons();
                }
            }

            function onActivity(x, y) {
                state.lastAction = now();
                if (typeof x === 'number' && typeof y === 'number') {
                    lookAt(x, y);
                }
                if (state.mode === 'anxious' || state.mode === 'panic') {
                    setState('friendly');
                }
            }

            // =====================================================
            // РЕАКЦИИ НА ВВОД
            // =====================================================
            document.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.ghost-btn') ||
                    e.target.closest('.log-panel') ||
                    e.target.closest('.theme-toggle')) return;

                onActivity(e.clientX, e.clientY);

                // Реакция зрачка (сужение от "вспышки")
                const pupil = document.getElementById('pupil');
                if (pupil && !prefersReducedMotion) {
                    pupil.style.transition = 'transform 0.12s ease';
                    pupil.style.transform = 'scale(0.85)';
                    setTimeout(() => {
                        pupil.style.transition = '';
                        pupil.style.transform = '';
                    }, 260);
                }

                if (Math.random() > 0.5) log(rnd(PHRASES.action), "active");
                triggerGlitch();
                spawnParticles(e.clientX, e.clientY);
            }, { passive: true });

            document.addEventListener('pointermove', (e) => {
                if (state.mode === 'panic') return;
                lookAt(e.clientX, e.clientY);
            }, { passive: true });

            document.addEventListener('keydown', (e) => {
                state.lastAction = now();
                if (state.mode === 'anxious' || state.mode === 'panic') {
                    setState('friendly');
                }
                if (Math.random() > 0.7) log(rnd(PHRASES.keyboard), "sys");
            }, { passive: true });

            // =====================================================
            // ЦИКЛ ПРОВЕРКИ СОСТОЯНИЙ
            // =====================================================
            setInterval(() => {
                if (!state.isPageVisible) return;

                const idle = now() - state.lastAction;

                if (idle > CONFIG.panicDelay && state.mode !== 'panic') {
                    setState('panic');
                } else if (idle > CONFIG.anxiousDelay &&
                          (state.mode === 'friendly' || state.mode === 'curious')) {
                    setState('anxious');
                } else if (idle > CONFIG.curiousDelay &&
                          state.mode === 'friendly') {
                    setState('curious');
                }

                // Периодические "дружелюбные" сообщения
                const sec = Math.floor((now() - state.sessionStart) / 1000);
                if (sec - state.lastFriendlyLog >= CONFIG.friendlyLogInterval &&
                    (state.mode === 'friendly' || state.mode === 'curious')) {
                    state.lastFriendlyLog = sec;
                    log(rnd(PHRASES.friendly), "sys");
                }

                // Редкая жуть
                if (Math.random() > CONFIG.weirdChance && state.mode === 'friendly') {
                    log(rnd(PHRASES.weird), "warn");
                    triggerGlitch();
                    body.classList.add('anxious');
                    setTimeout(() => {
                        if (state.mode === 'friendly') body.classList.remove('anxious');
                    }, 1800);
                }

                // Спавн кнопок
                if ((state.mode === 'friendly' || state.mode === 'curious') &&
                    Math.random() > 0.92) {
                    spawnBtn(false);
                }
            }, 1000);

            // =====================================================
            // КНОПКИ
            // =====================================================
            function clearButtons() {
                document.querySelectorAll('.ghost-btn').forEach(b => b.remove());
            }

            function getFreePosition() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const safeTop = CONFIG.btnSafeTop;
                const safeBottom = h - CONFIG.btnSafeBottom;
                const safeLeft = 20;
                const safeRight = w - 160;

                if (safeBottom <= safeTop || safeRight <= safeLeft) return null;

                const existing = [...document.querySelectorAll('.ghost-btn')].map(b => ({
                    x: parseFloat(b.style.left) || 0,
                    y: parseFloat(b.style.top) || 0,
                }));

                for (let attempt = 0; attempt < 20; attempt++) {
                    const x = safeLeft + Math.random() * (safeRight - safeLeft);
                    const y = safeTop + Math.random() * (safeBottom - safeTop);
                    const ok = existing.every(p => Math.hypot(p.x - x, p.y - y) > CONFIG.btnMinDist);
                    if (ok) return { x, y };
                }
                return null;
            }

            function spawnBtn(isPanic = false, delay = 0) {
                setTimeout(() => {
                    const current = document.querySelectorAll('.ghost-btn').length;
                    if (isPanic && current >= 4) return;
                    if (!isPanic && current >= CONFIG.maxBtns) return;

                    const pos = getFreePosition();
                    if (!pos) return;

                    const btn = document.createElement('button');
                    btn.className = 'ghost-btn';
                    btn.type = 'button';

                    if (isPanic) btn.textContent = rnd(PANIC_BTNS);
                    else if (Math.random() > 0.6) btn.textContent = rnd(WEIRD_BTNS);
                    else btn.textContent = rnd(NORMAL_BTNS);

                    btn.style.left = `${pos.x}px`;
                    btn.style.top = `${pos.y}px`;

                    let clicked = false;
                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        if (clicked) return;
                        clicked = true;

                        state.lastAction = now();
                        if (state.mode !== 'friendly') setState('friendly');

                        log(`> ${btn.textContent}`, "warn");
                        if (Math.random() > 0.5) log(rnd(PHRASES.btnClick), "sys");
                        triggerGlitch();
                        spawnParticles(e.clientX, e.clientY);

                        btn.classList.add('fade-out');
                        setTimeout(() => btn.remove(), 350);
                    });

                    document.body.appendChild(btn);

                    if (!isPanic) {
                        setTimeout(() => {
                            if (btn.parentNode && !clicked) {
                                btn.classList.add('fade-out');
                                setTimeout(() => btn.remove(), 350);
                            }
                        }, CONFIG.btnLife);
                    }
                }, delay);
            }

            // =====================================================
            // ЭФФЕКТЫ
            // =====================================================
            function triggerGlitch() {
                if (prefersReducedMotion) return;
                glitchOverlay.classList.remove('active');
                void glitchOverlay.offsetWidth;
                glitchOverlay.classList.add('active');
                setTimeout(() => glitchOverlay.classList.remove('active'), 260);
            }

            function spawnParticles(x, y) {
                if (prefersReducedMotion) return;
                const count = 6;
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 3;
                    p.style.cssText =
                        `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
                    document.body.appendChild(p);

                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 55;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;

                    requestAnimationFrame(() => {
                        p.style.transition =
                            `transform ${0.85 + Math.random() * 0.4}s cubic-bezier(0.1, 0.8, 0.2, 1), ` +
                            `opacity ${0.85 + Math.random() * 0.4}s ease`;
                        p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
                        p.style.opacity = '0';
                    });

                    setTimeout(() => p.remove(), 1500);
                }
            }

            // =====================================================
            // ВИДИМОСТЬ СТРАНИЦЫ
            // =====================================================
            document.addEventListener('visibilitychange', () => {
                state.isPageVisible = !document.hidden;
                if (document.hidden) {
                    state.lastAction = now();
                } else {
                    // Вернулся — моргни и поприветствуй
                    setTimeout(() => {
                        eyelid.classList.add('closing');
                        setTimeout(() => eyelid.classList.remove('closing'), 95);
                    }, 200);
                    log("Ты вернулся.", "ok", 400);
                    state.lastAction = now();
                    if (state.mode === 'panic' || state.mode === 'anxious') {
                        setState('friendly');
                    }
                }
            });

            // =====================================================
            // СТАРТ
            // =====================================================
            setTimeout(() => {
                log("Соединение установлено.", "sys");
                log(rnd(PHRASES.greeting), "active", 900);
                log("Наблюдение начато.", "ok", 400);
            }, 400);

            scheduleBlink();
            scheduleSakkad();
            requestAnimationFrame(startEyeLoop);

            // Защита
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                triggerGlitch();
            });

            // Скрыть курсор "не туда" на мобилках
            if ('ontouchstart' in window) {
                document.addEventListener('touchstart', () => {}, { passive: true });
            }

        })();
    </script>
</body>
</html>
