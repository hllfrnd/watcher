<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Observer active.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>☉ Hello Friend</title>
    <style>
        :root {
            --bg: #050505;
            --fg: #d4d4d8;
            --dim: #3f3f46;
            --mute: #18181b;
            --accent: #ffffff;
            --warn: #eab308;
            --err: #ef4444;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            touch-action: none; 
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            transition: filter 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Тревожное состояние (Отдаление и серость) */
        body.dread { 
            filter: grayscale(1) brightness(0.5); 
            transform: scale(0.97);
        }

        /* Шумовая текстура (атмосфера старой пленки) */
        .noise {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* ================= 2D ГЛАЗ ================= */
        .eye-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmin; height: 80vmin;
            pointer-events: none;
            z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }
        
        .eye {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            /* Медленное дыхание глаза */
            animation: breathe 8s infinite ease-in-out;
            transition: transform 0.4s ease;
        }

        /* Дыхание (пульсация размера) */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .iris {
            width: 55%; height: 55%;
            border-radius: 50%;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            /* Вязкое, медленное движение */
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .pupil {
            width: 40%; height: 40%;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.6s ease;
        }

        /* Веко */
        .eyelid {
            position: absolute; top: -1px; left: 0;
            width: 100%; height: 0%;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: height 0.15s ease-in-out;
        }

        /* Сужение зрачка (Стресс) */
        .squint .pupil { 
            transform: scale(0.5); 
            border-radius: 30%;
        }
        .squint .iris {
            border-color: rgba(255,255,255,0.15);
        }

        /* ================= ИНТЕРФЕЙС ================= */
        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem 1.5rem;
            pointer-events: none;
        }

        /* Шапка */
        .header {
            display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 3s ease forwards;
        }
        .title {
            font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5em; text-transform: uppercase;
            color: var(--fg); display: flex; align-items: center; gap: 0.8rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .title span { font-size: 1.4rem; font-weight: normal; }

        /* Зона кнопок */
        .spawn-zone {
            flex: 1;
            position: relative;
            width: 100%;
            margin-top: 2rem;
        }

        /* Случайные кнопки */
        .ghost-btn {
            position: absolute;
            background: transparent;
            border: 1px solid var(--mute);
            color: var(--dim); padding: 0.8rem 1.5rem;
            border-radius: 4px; font-size: 0.75rem; font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease; z-index: 30;
            letter-spacing: 0.15em;
            animation: fadeIn 1s ease;
            backdrop-filter: blur(4px);
        }
        .ghost-btn:hover { border-color: var(--dim); color: var(--fg); }
        .ghost-btn:active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
        .ghost-btn.fade-out { opacity: 0; transform: scale(0.95); }

        /* Лог */
        .log-panel {
            position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom)); left: 1.5rem;
            width: calc(100% - 3rem); max-width: 380px;
            height: 160px;
            border-left: 1px solid var(--mute);
            padding: 0.5rem 1rem;
            font-family: var(--mono);
            font-size: 0.7rem; line-height: 1.6;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 20;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 100%);
            opacity: 0;
            animation: fadeIn 4s ease 1s forwards;
        }
        .log-panel::-webkit-scrollbar { display: none; }
        
        .log-entry { color: var(--dim); animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(5px); }
        .log-entry.active { color: var(--fg); }
        .log-entry.sys { color: var(--mute); font-style: italic; }
        .log-entry.warn { color: var(--warn); }
        .log-entry.err { color: var(--err); }
        
        .log-time { opacity: 0.3; margin-right: 0.8rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Легкий глитч */
        .glitch-overlay {
            position: fixed; inset: 0; z-index: 999; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.03) 3px, rgba(255,255,255,0.03) 4px);
            opacity: 0;
            mix-blend-mode: screen;
        }
        .glitch-active { animation: glitch-anim 0.15s linear; }
        @keyframes glitch-anim {
            0% { opacity: 0.8; transform: translateY(-2px); }
            50% { opacity: 0.4; transform: translateY(2px); }
            100% { opacity: 0; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .eye-container { width: 95vmin; height: 95vmin; }
            .log-panel { height: 130px; font-size: 0.65rem; }
            .title { font-size: 0.9rem; letter-spacing: 0.3em; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <!-- Глаз -->
    <div class="eye-container">
        <div class="eye" id="eye">
            <div class="iris" id="iris">
                <div class="pupil" id="pupil"></div>
            </div>
            <div class="eyelid" id="eyelid"></div>
        </div>
    </div>

    <!-- Интерфейс -->
    <div class="ui-layer">
        <header class="header">
            <div class="title"><span>☉</span> Hello Friend</div>
        </header>

        <div class="spawn-zone" id="spawnZone"></div>
        <div class="log-panel" id="logPanel"></div>
    </div>

    <script>
        (() => {
            "use strict";

            const eye = document.getElementById('eye');
            const iris = document.getElementById('iris');
            const pupil = document.getElementById('pupil');
            const eyelid = document.getElementById('eyelid');
            const logPanel = document.getElementById('logPanel');
            const glitchOverlay = document.getElementById('glitchOverlay');
            const spawnZone = document.getElementById('spawnZone');
            const body = document.body;

            let lastActionTime = Date.now();
            let isIdle = false;
            let moveCount = 0;

            // === ЛОГ ===
            function addLog(text, type = 'active', delay = 0) {
                setTimeout(() => {
                    const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
                    const el = document.createElement('div');
                    el.className = `log-entry ${type}`;
                    el.innerHTML = `<span class="log-time">${time}</span> ${text}`;
                    logPanel.appendChild(el);
                    logPanel.scrollTop = logPanel.scrollHeight;
                    
                    if (logPanel.children.length > 20) {
                        logPanel.removeChild(logPanel.firstChild);
                    }
                }, delay);
            }

            // === ГЛАЗ ===
            function blink() {
                // Если глаз уже моргает, пропускаем
                if (eyelid.style.height === '100%') return;
                
                eyelid.style.height = '100%';
                setTimeout(() => { 
                    eyelid.style.height = '0%'; 
                }, 150);
                
                // Следующее моргание через 4-8 секунд
                setTimeout(blink, 4000 + Math.random() * 4000);
            }

            function lookAround() {
                if (isIdle) return; // Если пользователь замер, глаз не отводим
                
                // Движение по X и Y (в процентах) - плавное
                const moveX = (Math.random() - 0.5) * 40;
                const moveY = (Math.random() - 0.5) * 30;
                iris.style.transform = `translate(${moveX}%, ${moveY}%)`;
                
                setTimeout(lookAround, 3000 + Math.random() * 4000);
            }

            // Реакция зрачка на действие (сужение)
            function reactPupil(scale) {
                pupil.style.transform = `scale(${scale})`;
                setTimeout(() => { pupil.style.transform = `scale(1)`; }, 600);
            }

            // === ТРЕВОГА ===
            function triggerDread() {
                // Сужение зрачка
                eye.classList.add('squint');
                
                // Отдаление и серость
                body.classList.add('dread');
                
                // Легкий глитч
                glitchOverlay.classList.remove('glitch-active');
                void glitchOverlay.offsetWidth;
                glitchOverlay.classList.add('glitch-active');

                // Возврат через 2 секунды
                setTimeout(() => {
                    eye.classList.remove('squint');
                    body.classList.remove('dread');
                }, 2000);
            }

            // === ОТСЛЕЖИВАНИЕ ДЕЙСТВИЙ ===
            function resetIdle() {
                if (isIdle) {
                    isIdle = false;
                    addLog("Субъект вернулся в поле зрения.", "sys");
                    lookAround(); // Глаз снова начинает блуждать
                }
                lastActionTime = Date.now();
            }

            let moveTimeout;
            window.addEventListener('pointermove', () => {
                resetIdle();
                
                // Логируем движения с задержкой, чтобы не спамить
                clearTimeout(moveTimeout);
                moveTimeout = setTimeout(() => {
                    moveCount++;
                    if (moveCount % 3 === 0) {
                        addLog("Зафиксировано перемещение.", "active");
                    }
                }, 1000);
            }, { passive: true });

            document.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.log-panel') || e.target.closest('.ghost-btn')) return;
                resetIdle();
                addLog("Резкое движение. Тактильный контакт.", "active");
                reactPupil(0.6);
            }, { passive: true });

            document.addEventListener('keydown', () => {
                resetIdle();
                addLog("Активность клавиатуры.", "active");
                reactPupil(0.7);
            }, { passive: true });

            // === БЕЗДЕЙСТВИЕ ===
            setInterval(() => {
                const idleTime = Date.now() - lastActionTime;
                
                if (idleTime > 7000 && !isIdle) {
                    isIdle = true;
                    addLog("Движение отсутствует. Сканирование...", "warn");
                    
                    // Глаз смотрит прямо в центр
                    iris.style.transform = `translate(0%, 0%)`;
                    
                    // Эффект тревоги
                    setTimeout(() => {
                        triggerDread();
                        addLog("Ты здесь?", "err");
                    }, 3000);

                    // Если долго не двигается - зрачок расширяется (вглядывается)
                    setTimeout(() => {
                        if (isIdle) {
                            reactPupil(1.5);
                            addLog("Фокус на субъекте.", "sys");
                        }
                    }, 5000);
                }
            }, 1000);

            // === КНОПКИ ===
            const texts = ["Оглянись", "Сзади", "Тише", "Я здесь", "Не двигайся", "Пусто"];
            
            function spawnButton() {
                if (document.querySelectorAll('.ghost-btn').length >= 1) return;

                const btn = document.createElement('button');
                btn.className = 'ghost-btn';
                btn.textContent = texts[Math.floor(Math.random() * texts.length)];
                
                const rect = spawnZone.getBoundingClientRect();
                const x = 20 + Math.random() * Math.max(0, rect.width - 120);
                const y = 20 + Math.random() * Math.max(0, rect.height - 50);
                
                btn.style.left = `${x}px`;
                btn.style.top = `${y}px`;

                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    addLog(`Нажатие: "${btn.textContent}"`, "warn");
                    triggerDread();
                    btn.remove();
                });

                spawnZone.appendChild(btn);
                
                // Кнопка исчезает через 6 секунд
                setTimeout(() => {
                    if (btn.parentNode) {
                        btn.classList.add('fade-out');
                        setTimeout(() => btn.remove(), 400);
                    }
                }, 6000);
            }

            // === ФОНОВЫЕ СОБЫТИЯ ===
            setInterval(() => {
                // Кнопки появляются редко
                if (Math.random() > 0.7) spawnButton();
                
                // Случайные помехи
                if (Math.random() > 0.9) {
                    addLog("Сбой сигнала...", "warn");
                    glitchOverlay.classList.remove('glitch-active');
                    void glitchOverlay.offsetWidth;
                    glitchOverlay.classList.add('glitch-active');
                }
            }, 5000);

            // === СТАРТ ===
            // Задержка перед первым логом (система "просыпается")
            addLog("Соединение...", "sys", 500);
            addLog("Наблюдение активно.", "sys", 1500);
            addLog("Ожидание.", "sys", 3000);
            
            setTimeout(blink, 2000);
            lookAround();

            // Защита от F12
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    addLog("Попытка вмешательства.", "err");
                    triggerDread();
                }
            });

        })();
    </script>
</body>
</html>
