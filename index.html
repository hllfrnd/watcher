<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Оно видит тебя.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>☉ Hello Friend — Watcher</title>
    <style>
        :root {
            --bg: #040405;
            --bg-grad-1: #0a0a0c;
            --bg-grad-2: #000000;
            --fg: #e4e4e7;
            --dim: #71717a;
            --accent: #e4e4e7;

            --panel-bg: rgba(8, 8, 10, 0.55);
            --panel-bg-overlay: rgba(0, 0, 0, 0.35);
            --panel-border: rgba(255, 255, 255, 0.06);
            --panel-glow: rgba(255, 255, 255, 0.04);

            --term-fg: #d4d4d8;
            --term-dim: #52525b;
            --term-err: #ff4d4d;
            --term-warn: #f59e0b;
            --term-ok: #3ddc84;
            --term-glitch: #a855f7;
            --term-whisper: #71717a;

            --sclera-1: #cfcfd4;
            --sclera-2: #9a9aa1;
            --sclera-3: #4a4a52;
            --sclera-edge: #0e0e11;

            --iris-inner: #1a1a1e;
            --iris-mid: #08080a;
            --iris-outer: #000000;

            --pupil-core: #000000;
            --pupil-hint: #060608;

            --highlight: rgba(255,255,255,0.42);

            --vignette: rgba(0,0,0,0.94);
            --glitch-color: rgba(255,255,255,0.10);

            --fog-color: rgba(180, 180, 200, 0.05);
            --grain-opacity: 0.05;
            --scanline-opacity: 0.03;

            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-eye: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-blink-close: cubic-bezier(0.5, 0, 0.9, 0);
            --ease-blink-open: cubic-bezier(0.1, 0.8, 0.3, 1);

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            transition:
                background 1.6s var(--ease-smooth),
                color 1s var(--ease-smooth),
                filter 10s var(--ease-smooth);
        }

        body {
            background:
                radial-gradient(circle at 50% 42%, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%),
                var(--bg);
            position: fixed;
            inset: 0;
            filter: brightness(1.00) contrast(1.03);
        }

        body.calm     { filter: brightness(1.00) contrast(1.03); }
        body.curious  { filter: brightness(1.04) contrast(1.05); }
        body.watchful { filter: brightness(0.80) contrast(1.05) saturate(0.7); }
        body.anxious  { filter: brightness(0.60) contrast(1.10) grayscale(0.55); }
        body.paranoid { filter: brightness(0.42) contrast(1.15) grayscale(0.75) hue-rotate(-8deg); }
        body.panic    { filter: brightness(0.24) contrast(1.20) grayscale(0.95) hue-rotate(-15deg); }

        /* === СЛОИ ЭФФЕКТОВ === */
        .vignette {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(circle at 50% 45%,
                transparent 24%, var(--vignette) 100%);
            transition: opacity 6s ease;
            opacity: 0.82;
            animation: vignette-breathe 12s ease-in-out infinite;
            will-change: opacity;
        }
        @keyframes vignette-breathe {
            0%, 100% { opacity: 0.78; }
            50%      { opacity: 0.9; }
        }
        body.watchful .vignette { opacity: 0.9; }
        body.anxious  .vignette { opacity: 0.97; }
        body.paranoid .vignette { opacity: 1; }
        body.panic    .vignette { opacity: 1; }

        .fog {
            position: fixed; inset: -20%; z-index: 2;
            pointer-events: none;
            opacity: 0.75;
            transition: opacity 6s ease;
            will-change: transform, opacity;
        }
        .fog::before,
        .fog::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 30% 30%, var(--fog-color) 0%, transparent 60%),
                radial-gradient(ellipse 50% 35% at 70% 60%, var(--fog-color) 0%, transparent 55%),
                radial-gradient(ellipse 70% 30% at 50% 80%, var(--fog-color) 0%, transparent 60%);
            will-change: transform;
        }
        .fog::before { animation: fog-drift-1 38s ease-in-out infinite; }
        .fog::after  { animation: fog-drift-2 52s ease-in-out infinite reverse; opacity: 0.7; }
        @keyframes fog-drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-8%, 3%) scale(1.08); }
        }
        @keyframes fog-drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1.05); }
            50%      { transform: translate(6%, -4%) scale(1); }
        }
        body.anxious .fog  { opacity: 0.9; }
        body.paranoid .fog { opacity: 1; }
        body.panic .fog    { opacity: 1; }

        .grain {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            opacity: var(--grain-opacity);
            background-image:
                repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.5) 0 1px, transparent 1px 3px),
                repeating-radial-gradient(circle at 72% 58%, rgba(255,255,255,0.35) 0 1px, transparent 1px 4px),
                repeating-radial-gradient(circle at 38% 82%, rgba(255,255,255,0.4) 0 1px, transparent 1px 3px);
            animation: grain-shift 0.6s steps(3) infinite;
            mix-blend-mode: overlay;
        }
        @keyframes grain-shift {
            0%   { transform: translate(0, 0); }
            33%  { transform: translate(-1px, 1px); }
            66%  { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .scanlines {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            opacity: var(--scanline-opacity);
            background: repeating-linear-gradient(0deg,
                transparent 0px, transparent 2px,
                rgba(255,255,255,0.6) 2px, rgba(255,255,255,0.6) 3px);
            animation: scanlines-pulse 6s ease-in-out infinite;
            mix-blend-mode: overlay;
        }
        @keyframes scanlines-pulse {
            0%, 100% { opacity: var(--scanline-opacity); }
            50%      { opacity: calc(var(--scanline-opacity) * 1.8); }
        }

        .dust-layer {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }
        .dust {
            position: absolute;
            width: 1.5px; height: 1.5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(255,255,255,0.4);
            will-change: transform, opacity;
        }
        @keyframes dust-float {
            0%   { transform: translate(0, 0); opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translate(var(--dx, 20px), var(--dy, -30px)); opacity: 0; }
        }

        .snow-layer, .ash-layer {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        .snow-layer.on, .ash-layer.on { display: block; }
        .snowflake {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
            will-change: transform;
        }
        @keyframes snow-fall {
            0%   { transform: translate(0, -10vh) rotate(0deg); }
            100% { transform: translate(var(--sway, 40px), 110vh) rotate(360deg); }
        }
        .ash {
            position: absolute;
            width: 2px; height: 4px;
            background: rgba(200,200,200,0.5);
            border-radius: 1px;
            will-change: transform;
        }
        @keyframes ash-fall {
            0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translate(var(--sway, -30px), 110vh) rotate(720deg); opacity: 0; }
        }

        .chromatic {
            position: fixed; inset: 0; z-index: 6;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            transition: opacity 3s ease;
        }
        body.paranoid .chromatic,
        body.panic .chromatic {
            opacity: 0.08;
            background:
                radial-gradient(circle at 30% 50%, rgba(255,0,0,0.3) 0%, transparent 30%),
                radial-gradient(circle at 70% 50%, rgba(0,100,255,0.3) 0%, transparent 30%);
        }

        /* ================= ГЛАЗ ================= */
        .eye-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(82vmin, 840px);
            height: min(82vmin, 840px);
            pointer-events: none;
            z-index: 5;
            display: flex; justify-content: center; align-items: center;
        }

        .eye-socket {
            position: absolute;
            width: 140%; height: 140%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                transparent 30%,
                rgba(0,0,0,0.6) 58%,
                rgba(0,0,0,0.98) 100%);
            filter: blur(55px);
            transition: filter 10s var(--ease-smooth), opacity 10s var(--ease-smooth);
            opacity: 0.97;
        }
        body.panic .eye-socket { filter: blur(70px); opacity: 1; }

        .eye {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.9),
                0 0 120px rgba(0,0,0,0.95),
                inset 0 0 160px rgba(0,0,0,1);
            animation: eye-breathe 11s ease-in-out infinite;
        }
        @keyframes eye-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.014); }
        }

        .sclera {
            width: 88%; height: 88%;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 45%,
                    var(--sclera-1) 0%,
                    var(--sclera-2) 40%,
                    var(--sclera-3) 75%,
                    var(--sclera-edge) 100%);
            display: flex; justify-content: center; align-items: center;
            transition: background 10s var(--ease-smooth);
            overflow: hidden;
            filter: blur(0.5px);
        }

        .sclera::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                transparent 28%,
                rgba(0,0,0,0.4) 55%,
                rgba(0,0,0,0.85) 82%,
                rgba(0,0,0,0.99) 100%);
            pointer-events: none;
            z-index: 3;
            transition: background 10s var(--ease-smooth);
        }
        body.paranoid .sclera::before,
        body.anxious .sclera::before {
            background: radial-gradient(circle at 50% 45%,
                transparent 22%,
                rgba(0,0,0,0.5) 48%,
                rgba(0,0,0,0.92) 82%,
                rgba(0,0,0,1) 100%);
        }
        body.panic .sclera::before {
            background: radial-gradient(circle at 50% 45%,
                transparent 14%,
                rgba(0,0,0,0.6) 42%,
                rgba(0,0,0,0.96) 80%,
                rgba(0,0,0,1) 100%);
        }

        .sclera::after {
            content: '';
            position: absolute;
            top: -8%; left: -8%;
            width: 116%; height: 50%;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.65) 0%,
                rgba(0,0,0,0.2) 55%,
                transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        .iris {
            width: 52%; height: 52%;
            border-radius: 50%;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            will-change: transform;
            transition: transform 1.2s var(--ease-eye);
            background:
                radial-gradient(circle at 50% 45%,
                    var(--iris-inner) 0%,
                    var(--iris-mid) 55%,
                    var(--iris-outer) 100%);
            box-shadow:
                0 0 50px rgba(0,0,0,1),
                inset 0 0 40px rgba(0,0,0,0.95),
                inset 0 0 8px rgba(255,255,255,0.025);
        }

        .iris::before {
            content: '';
            position: absolute;
            inset: -3%;
            border-radius: 50%;
            background: radial-gradient(circle,
                transparent 72%,
                rgba(0,0,0,0.92) 90%,
                transparent 100%);
            pointer-events: none;
        }

        .pupil {
            width: 44%; height: 44%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 48%,
                    var(--pupil-hint) 0%,
                    var(--pupil-core) 60%,
                    #000 100%);
            position: relative;
            box-shadow:
                0 0 35px rgba(0,0,0,1),
                inset 0 0 22px rgba(0,0,0,1),
                0 0 8px 2px rgba(255,255,255,0.03);
            transition: transform 0.7s ease;
            transform: scale(var(--pupil-base, 1));
            will-change: transform;
        }

        /* Двойной отблеск */
        .pupil::before {
            content: '';
            position: absolute;
            top: 14%; left: 20%;
            width: 28%; height: 28%;
            border-radius: 50%;
            background: radial-gradient(circle,
                var(--highlight) 0%,
                transparent 70%);
            filter: blur(1.4px);
            pointer-events: none;
            opacity: 0.45;
            transition: opacity 2s ease;
        }
        .pupil::after {
            content: '';
            position: absolute;
            bottom: 18%; right: 22%;
            width: 12%; height: 12%;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,255,255,0.35) 0%,
                transparent 70%);
            filter: blur(1px);
            pointer-events: none;
            opacity: 0.35;
            transition: opacity 2s ease;
        }
        body.anxious  .pupil::before,
        body.anxious  .pupil::after { opacity: 0.22; }
        body.paranoid .pupil::before,
        body.paranoid .pupil::after { opacity: 0.15; }
        body.panic    .pupil::before,
        body.panic    .pupil::after { opacity: 0.08; }

        body.calm     .pupil { --pupil-base: 1.00; }
        body.curious  .pupil { --pupil-base: 1.18; }
        body.watchful .pupil { --pupil-base: 0.88; }
        body.anxious  .pupil {
            --pupil-base: 0.62;
            animation: pupil-tremble-soft 0.6s linear infinite;
        }
        body.paranoid .pupil {
            --pupil-base: 0.48;
            animation: pupil-tremble-soft 0.3s linear infinite;
        }
        body.panic .pupil {
            --pupil-base: 0.38;
            animation: pupil-tremble-hard 0.14s linear infinite;
        }

        @keyframes pupil-tremble-soft {
            0%, 100% { transform: translate(0, 0) scale(var(--pupil-base)); }
            50%      { transform: translate(0.7px, -0.7px) scale(var(--pupil-base)); }
        }
        @keyframes pupil-tremble-hard {
            0%   { transform: translate(0, 0) scale(var(--pupil-base)); }
            25%  { transform: translate(1.4px, -1.4px) scale(var(--pupil-base)); }
            50%  { transform: translate(-1.4px, 1.4px) scale(var(--pupil-base)); }
            75%  { transform: translate(1.4px, 1.4px) scale(var(--pupil-base)); }
            100% { transform: translate(0, 0) scale(var(--pupil-base)); }
        }

        /* Клик-пульс — через отдельную анимацию, не инлайн */
        .pupil.click-pulse {
            animation: pupil-click 0.52s cubic-bezier(0.3, 1, 0.5, 1) !important;
        }
        @keyframes pupil-click {
            0%   { transform: scale(var(--pupil-base, 1)); }
            40%  { transform: scale(calc(var(--pupil-base, 1) * 1.32)); }
            100% { transform: scale(var(--pupil-base, 1)); }
        }

        /* === ВЕКО — реалистичное моргание === */
        .eyelid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 0%;
            background: linear-gradient(to bottom,
                #040405 0%,
                #040405 80%,
                #08080a 92%,
                #0e0e11 100%);
            z-index: 10;
            border-radius: 0 0 50% 50% / 0 0 7% 7%;
            box-shadow: inset 0 -2px 6px rgba(255,255,255,0.02);
            transition: height 0.28s var(--ease-blink-open);
            pointer-events: none;
            will-change: height;
        }
        .eyelid.closing {
            height: 100%;
            transition: height 0.09s var(--ease-blink-close);
        }
        .eyelid.double {
            animation: blink-double 0.6s var(--ease-blink-close) forwards;
        }
        @keyframes blink-double {
            0%   { height: 0%; }
            35%  { height: 100%; }
            55%  { height: 100%; }
            70%  { height: 0%; }
            82%  { height: 100%; }
            100% { height: 100%; }
        }
        body.panic .eyelid,
        body.paranoid .eyelid {
            transition: height 0.55s var(--ease-blink-open);
        }

        /* === UI === */
        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: calc(1.5rem + var(--safe-top)) calc(1.5rem + var(--safe-right)) calc(1.5rem + var(--safe-bottom)) calc(1.5rem + var(--safe-left));
            pointer-events: none;
        }
        .ui-layer > * { pointer-events: auto; }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            opacity: 0; animation: fadeIn 3s ease 1.2s forwards;
        }

        .title {
            font-size: 0.88rem; font-weight: 800; letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--fg);
            display: flex; align-items: center; gap: 0.6rem;
            opacity: 0.82;
            transition: opacity 3s ease;
        }
        .title.whisper { opacity: 0.4; }
        .title-icon {
            font-size: 1.1rem;
            color: var(--accent);
            animation: eye-pulse-icon 5s ease-in-out infinite;
        }
        @keyframes eye-pulse-icon {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        /* === ОКНО ЛОГА === */
        .log-wrap {
            position: absolute;
            bottom: calc(1.5rem + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 560px;
            height: 200px;
            z-index: 100;
            pointer-events: auto;
            opacity: 0;
            animation: fadeIn 2.5s ease 1s forwards;
        }

        .log-panel {
            position: relative;
            width: 100%; height: 100%;
            background:
                linear-gradient(to bottom,
                    var(--panel-bg-overlay) 0%,
                    transparent 30%,
                    transparent 70%,
                    var(--panel-bg-overlay) 100%),
                var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 1.4rem 1.3rem 1.1rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.65;
            backdrop-filter: blur(26px) saturate(1.3);
            -webkit-backdrop-filter: blur(26px) saturate(1.3);
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 5px;
            box-shadow:
                0 24px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.025),
                inset 0 0 40px rgba(255,255,255,0.01);
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom,
                transparent 0%, black 8%, black 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom,
                transparent 0%, black 8%, black 92%, transparent 100%);
        }
        .log-panel::-webkit-scrollbar { display: none; }

        .log-label {
            position: absolute;
            top: 0.5rem; left: 1.3rem;
            font-family: ui-monospace, monospace;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--term-dim);
            opacity: 0.5;
            pointer-events: none;
            display: flex; align-items: center; gap: 0.5rem;
            z-index: 2;
        }
        .log-live {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--term-ok);
            box-shadow: 0 0 6px var(--term-ok);
            animation: live-pulse 2s ease-in-out infinite;
        }
        @keyframes live-pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .log-entry {
            color: var(--term-dim);
            animation: slideUp 0.45s ease forwards;
            opacity: 0;
            transform: translateY(4px);
            word-break: break-word;
            text-shadow: 0 0 8px rgba(255,255,255,0.05);
            transition: opacity 1s ease;
        }
        .log-entry.fade-old { opacity: 0.5; }
        .log-entry.active { color: var(--term-fg); }
        .log-entry.warn   { color: var(--term-warn); font-weight: 600; }
        .log-entry.err    { color: var(--term-err); font-weight: 700; }
        .log-entry.ok     { color: var(--term-ok); }
        .log-entry.whisper { color: var(--term-whisper); font-style: italic; opacity: 0.7; }
        .log-entry.glitch {
            color: var(--term-glitch);
            font-style: italic;
            animation: glitch-text 0.4s steps(2) forwards;
        }
        @keyframes glitch-text {
            0%   { transform: translate(0, 0); opacity: 0; }
            25%  { transform: translate(-2px, 1px); opacity: 1; }
            50%  { transform: translate(2px, -1px); }
            75%  { transform: translate(-1px, 0); }
            100% { transform: translate(0, 0); opacity: 1; }
        }

                        state.typing = false;
                        processQueue();
                        return;
                    }

                    const t = new Date().toLocaleTimeString('en-US', {
                        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });

                    const el = document.createElement('div');
                    el.className = `log-entry ${type}`;
                    el.innerHTML =
                        `<span class="log-time">[${t}]</span>` +
                        `<span class="msg"></span>` +
                        `<span class="cursor"></span>`;

                    logPanel.appendChild(el);
                    logPanel.scrollTop = logPanel.scrollHeight;

                    const entries = logPanel.querySelectorAll('.log-entry');
                    entries.forEach((e, i) => {
                        if (i < entries.length - 4) e.classList.add('fade-old');
                    });

                    const msg = el.querySelector('.msg');
                    const cursor = el.querySelector('.cursor');
                    let i = 0;
                    const speed = state.isPageVisible ? CONFIG.logSpeed : 2;

                    const typeChar = () => {
                        if (state.typingAbort) {
                            cursor.remove();
                            state.typingAbort = false;
                            state.typing = false;
                            processQueue();
                            return;
                        }
                        if (i < text.length) {
                            msg.textContent += text.charAt(i++);
                            logPanel.scrollTop = logPanel.scrollHeight;
                            setTimeout(typeChar, speed + Math.random() * 18);
                        } else {
                            cursor.remove();
                            state.typing = false;
                            setTimeout(processQueue, 550);
                        }
                    };
                    typeChar();

                    while (logPanel.children.length > CONFIG.maxLogEntries) {
                        logPanel.removeChild(logPanel.firstChild);
                    }
                }, delay);
            }

            // =====================================================
            // ГЛАЗ
            // =====================================================
            function startEyeLoop() {
                if (state.rafId !== null) return;
                const tick = () => {
                    const dx = state.targetX - state.currentX;
                    const dy = state.targetY - state.currentY;
                    state.currentX += dx * CONFIG.lookInterp;
                    state.currentY += dy * CONFIG.lookInterp;
                    iris.style.transform =
                        `translate(${state.currentX.toFixed(2)}%, ${state.currentY.toFixed(2)}%)`;

                    if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
                        state.rafId = requestAnimationFrame(tick);
                    } else {
                        state.currentX = state.targetX;
                        state.currentY = state.targetY;
                        iris.style.transform =
                            `translate(${state.targetX.toFixed(2)}%, ${state.targetY.toFixed(2)}%)`;
                        state.rafId = null;
                    }
                };
                state.rafId = requestAnimationFrame(tick);
            }

            function lookAtPoint(px, py) {
                state.targetX = clamp(px, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                state.targetY = clamp(py, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                startEyeLoop();
            }

            function lookAtCursor(x, y) {
                if (state.mode === 'panic') return;
                if (Math.random() < CONFIG.hallucinationChance) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = rand(6, 14);
                    lookAtPoint(Math.cos(angle) * r, Math.sin(angle) * r);
                    return;
                }
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = x - cx, dy = y - cy;
                const dist = Math.hypot(dx, dy);
                if (dist < 1) return;
                const power = Math.min(dist / 10, CONFIG.lookMaxOffset);
                lookAtPoint((dx / dist) * power, (dy / dist) * power);
            }

            function lookCenter() { lookAtPoint(0, 0); }

            function scheduleAutoLook() {
                clearTimeout(state.autoLookTimeout);
                state.autoLookTimeout = setTimeout(() => {
                    if (!state.isPageVisible) { scheduleAutoLook(); return; }
                    const cursorIdle = now() - state.lastCursorMove;
                    const overrideActive = now() < state.autoLookOverrideUntil;
                    if (cursorIdle > CONFIG.cursorIdleTimeout &&
                        state.mode !== 'panic' && !overrideActive) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = rand(4, CONFIG.lookMaxOffset);
                        lookAtPoint(Math.cos(angle) * radius, Math.sin(angle) * radius);
                        setTimeout(() => {
                            if (now() >= state.autoLookOverrideUntil &&
                                state.mode !== 'panic') {
                                const a2 = Math.random() * Math.PI * 2;
                                const r2 = rand(2, CONFIG.lookMaxOffset * 0.7);
                                lookAtPoint(Math.cos(a2) * r2, Math.sin(a2) * r2);
                            }
                        }, rand(CONFIG.autoLookDurMin, CONFIG.autoLookDurMax));
                    }
                    scheduleAutoLook();
                }, rand(CONFIG.autoLookDelayMin, CONFIG.autoLookDelayMax));
            }

            function scheduleSakkad() {
                clearTimeout(state.sakkadTimeout);
                state.sakkadTimeout = setTimeout(() => {
                    if (state.isPageVisible && state.mode !== 'panic' && Math.random() > 0.45) {
                        const mx = (Math.random() - 0.5) * CONFIG.sakkadAmp;
                        const my = (Math.random() - 0.5) * CONFIG.sakkadAmp;
                        state.targetX = clamp(state.targetX + mx, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                        state.targetY = clamp(state.targetY + my, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                        startEyeLoop();
                    }
                    scheduleSakkad();
                }, rand(CONFIG.sakkadDelayMin, CONFIG.sakkadDelayMax));
            }

            // === Моргание ===
            function blink() {
                if (!state.isPageVisible || state.blinking) {
                    scheduleBlink();
                    return;
                }
                state.blinking = true;

                const isHeavy = state.mode === 'panic' || state.mode === 'paranoid';
                const isDouble = Math.random() < CONFIG.doubleBlinkChance && !isHeavy;

                const finish = () => {
                    eyelid.classList.remove('closing', 'double');
                    state.blinking = false;
                    eyelid.removeEventListener('animationend', finish);
                };

                if (isDouble) {
                    eyelid.classList.add('double');
                    // fallback — если animationend не сработает
                    const guard = setTimeout(finish, 800);
                    eyelid.addEventListener('animationend', () => {
                        clearTimeout(guard);
                        finish();
                    }, { once: true });
                } else {
                    eyelid.classList.add('closing');
                    const holdTime = isHeavy ? 160 : 40 + Math.random() * 60;
                    setTimeout(() => {
                        eyelid.classList.remove('closing');
                        setTimeout(() => { state.blinking = false; }, 300);
                    }, holdTime);
                }

                scheduleBlink();
            }

            function scheduleBlink() {
                clearTimeout(state.blinkTimeout);
                const base = state.mode === 'panic' ? 4000 : 5000;
                const delay = rand(base, base + 4500);
                state.blinkTimeout = setTimeout(blink, delay);
            }

            // =====================================================
            // СОСТОЯНИЯ
            // =====================================================
            const STATE_ORDER = ['calm', 'curious', 'watchful', 'anxious', 'paranoid', 'panic'];

            function setState(mode, skipLog = false) {
                if (state.mode === mode) return;
                const prev = state.mode;
                state.mode = mode;
                flushStateTimers();
                body.classList.remove('calm', 'curious', 'watchful', 'anxious', 'paranoid', 'panic');
                body.classList.add(mode);
                title.classList.toggle('whisper', mode === 'anxious' || mode === 'paranoid' || mode === 'panic');

                if (!skipLog) {
                    if (mode === 'curious') {
                        log(rnd(PHRASES.curious), "active", 700);
                    } else if (mode === 'watchful') {
                        log(rnd(PHRASES.watchful), "sys", 700);
                    } else if (mode === 'anxious') {
                        lookCenter();
                        log(rnd(PHRASES.anxious), "warn", 900);
                    } else if (mode === 'paranoid') {
                        lookCenter();
                        log(rnd(PHRASES.paranoid), "err", 500);
                        triggerGlitch();
                        schedule(() => triggerSnow(), 800);
                    } else if (mode === 'panic') {
                        lookCenter();
                        log(rnd(PHRASES.panic), "err", 400);
                        triggerGlitch();
                        schedule(() => triggerAsh(), 600);
                        clearButtons();
                        for (let i = 0; i < 3; i++) spawnBtn(true, i * 300);
                    } else if (mode === 'calm') {
                        log(rnd(PHRASES.calm), "sys", 600);
                        clearButtons();
                    }
                }

                if ((prev === 'anxious' || prev === 'paranoid' || prev === 'panic') && mode === 'calm') {
                    log(rnd(PHRASES.greeting), "active", 400);
                }

                state.autoLookOverrideUntil = 0;
                state.lastStateAdvance = now();
            }

            function onActivity(x, y) {
                state.lastAction = now();
                state.lastStateAdvance = now();
                if (typeof x === 'number' && typeof y === 'number') {
                    lookAtCursor(x, y);
                }
                if (state.mode === 'paranoid' || state.mode === 'anxious' || state.mode === 'panic') {
                    setState('calm');
                } else if (state.mode === 'watchful') {
                    setState('curious');
                }
            }

            // =====================================================
            // ВВОД
            // =====================================================
            document.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.ghost-btn') ||
                    e.target.closest('.log-wrap')) return;

                onActivity(e.clientX, e.clientY);

                if (pupil && !prefersReducedMotion) {
                    pupil.classList.remove('click-pulse');
                    void pupil.offsetWidth;
                    pupil.classList.add('click-pulse');
                    pupil.addEventListener('animationend', () => {
                        pupil.classList.remove('click-pulse');
                    }, { once: true });
                }

                if (Math.random() > 0.55) log(rnd(PHRASES.action), "active");
                triggerGlitch();
                spawnParticles(e.clientX, e.clientY);
            }, { passive: true });

            document.addEventListener('pointermove', (e) => {
                const t = now();
                if (t - state.lastPointerMove < CONFIG.pointerThrottleMs) return;
                state.lastPointerMove = t;

                // Детект быстрого движения по скорости, а не по времени
                if (state.prevPointerT) {
                    const dt = t - state.prevPointerT;
                    if (dt > 0 && dt < 100) {
                        const dist = Math.hypot(e.clientX - state.prevPointerX, e.clientY - state.prevPointerY);
                        const speed = dist / dt;
                        if (speed > CONFIG.fastMoveSpeed && (state.mode === 'calm' || state.mode === 'curious')) {
                            state.fastMoveUntil = t + 900;
                        }
                    }
                }
                state.prevPointerX = e.clientX;
                state.prevPointerY = e.clientY;
                state.prevPointerT = t;
                state.lastCursorMove = t;

                if (state.mode === 'panic') return;
                lookAtCursor(e.clientX, e.clientY);
            }, { passive: true });

            // Тач-события для мобил — движение пальца тоже двигает взгляд
            document.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                if (!touch) return;
                state.lastAction = now();
                state.lastStateAdvance = now();
                state.lastCursorMove = now();
                if (state.mode === 'panic') return;
                lookAtCursor(touch.clientX, touch.clientY);
            }, { passive: true });

            document.addEventListener('keydown', (e) => {
                state.lastAction = now();
                state.lastCursorMove = now();
                state.lastStateAdvance = now();
                if (state.mode === 'paranoid' || state.mode === 'anxious' || state.mode === 'panic') {
                    setState('calm');
                }
                if (Math.random() > 0.75) log(rnd(PHRASES.keyboard), "sys");
                if (e.key === 'Escape' && state.mode !== 'calm') {
                    log("выхода нет.", "err");
                    triggerGlitch();
                }
            }, { passive: true });

            // =====================================================
            // ЦИКЛ СОСТОЯНИЙ
            // =====================================================
            function getNextState(current) {
                const idx = STATE_ORDER.indexOf(current);
                if (Math.random() < 0.10 && idx + 2 < STATE_ORDER.length) {
                    return STATE_ORDER[idx + 2];
                }
                return STATE_ORDER[Math.min(idx + 1, STATE_ORDER.length - 1)];
            }

            function tickStates() {
                if (!state.isPageVisible) return;

                const idle = now() - state.lastAction;
                const elapsed = now() - state.lastStateAdvance;

                let targetMode = 'calm';
                if (idle > 45000) targetMode = 'panic';
                else if (idle > 30000) targetMode = 'paranoid';
                else if (idle > 20000) targetMode = 'anxious';
                else if (idle > 12000) targetMode = 'watchful';
                else if (idle > 6000)  targetMode = 'curious';

                if (state.fastMoveUntil > now() && state.mode === 'curious') {
                    if (Math.random() < 0.35) {
                        setState('anxious');
                        state.lastStateAdvance = now();
                    }
                }

                if (STATE_ORDER.indexOf(targetMode) > STATE_ORDER.indexOf(state.mode)) {
                    if (elapsed > 2500) {
                        const next = getNextState(state.mode);
                        if (STATE_ORDER.indexOf(next) <= STATE_ORDER.indexOf(targetMode)) {
                            setState(next);
                            state.lastStateAdvance = now();
                        }
                    }
                }

                // Спонтанный спазм
                if (Math.random() < 0.02 && state.mode !== 'panic') {
                    const a = Math.random() * Math.PI * 2;
                    const r = rand(8, 15);
                    lookAtPoint(Math.cos(a) * r, Math.sin(a) * r);
                    schedule(() => {
                        if (state.mode !== 'panic') lookCenter();
                    }, 380);
                }

                if (Math.random() < CONFIG.falseLogChance) log(rnd(PHRASES.falseLogs), "glitch");
                if (Math.random() < CONFIG.hallucinationChance * 0.4) log(rnd(PHRASES.hallucinations), "glitch", 300);
                if (Math.random() < CONFIG.whisperChance) log(rnd(PHRASES.whispers), "whisper", 400);

                if (Math.random() < CONFIG.snowChance && state.mode !== 'panic') triggerSnow();
                if (Math.random() < CONFIG.ashChance && (state.mode === 'paranoid' || state.mode === 'panic')) triggerAsh();

                const sec = Math.floor((now() - state.sessionStart) / 1000);
                if (sec - state.lastFriendlyLog >= CONFIG.friendlyLogInterval &&
                    (state.mode === 'calm' || state.mode === 'curious')) {
                    state.lastFriendlyLog = sec;
                    const arr = state.mode === 'calm' ? PHRASES.calm : PHRASES.curious;
                    log(rnd(arr), "sys");
                }

                if ((state.mode === 'calm' || state.mode === 'curious') && Math.random() > 0.93) {
                    spawnBtn(false);
                }
                if (state.mode === 'paranoid' && Math.random() > 0.88) {
                    spawnBtn(false, 0, true);
                }
            }

            // =====================================================
            // КНОПКИ
            // =====================================================
            function clearButtons() {
                document.querySelectorAll('.ghost-btn').forEach(b => b.remove());
            }

            function getFreePosition() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const safeTop = CONFIG.btnSafeTop;
                const safeBottom = h - CONFIG.btnSafeBottom;
                const safeLeft = 20;
                const safeRight = Math.max(safeLeft + 50, w - (isMobile ? 100 : 160));
                if (safeBottom <= safeTop || safeRight <= safeLeft) return null;
                const existing = [...document.querySelectorAll('.ghost-btn')].map(b => ({
                    x: parseFloat(b.style.left) || 0,
                    y: parseFloat(b.style.top) || 0,
                }));
                const minDist = isMobile ? 80 : CONFIG.btnMinDist;
                for (let attempt = 0; attempt < 20; attempt++) {
                    const x = safeLeft + Math.random() * (safeRight - safeLeft);
                    const y = safeTop + Math.random() * (safeBottom - safeTop);
                    const ok = existing.every(p => Math.hypot(p.x - x, p.y - y) > minDist);
                    if (ok) return { x, y };
                }
                return null;
            }

            function spawnBtn(isPanic = false, delay = 0, phantom = false) {
                setTimeout(() => {
                    // Проверка состояния перед добавлением (фикс «зависших» кнопок)
                    if (isPanic && state.mode !== 'panic') return;

                    const current = document.querySelectorAll('.ghost-btn').length;
                    if (isPanic && current >= 4) return;
                    if (!isPanic && current >= CONFIG.maxBtns) return;
                    const pos = getFreePosition();
                    if (!pos) return;

                    const btn = document.createElement('button');
                    btn.className = 'ghost-btn' + (phantom ? ' phantom' : '');
                    btn.type = 'button';

                    if (phantom) btn.textContent = rnd(PHANTOM_BTNS);
                    else if (isPanic) btn.textContent = rnd(PANIC_BTNS);
                    else if (Math.random() > 0.6) btn.textContent = rnd(WEIRD_BTNS);
                    else btn.textContent = rnd(NORMAL_BTNS);

                    btn.style.left = `${pos.x}px`;
                    btn.style.top = `${pos.y}px`;

                    let clicked = false;

                    if (phantom) {
                        const vanish = () => {
                            if (clicked) return;
                            clicked = true;
                            btn.classList.add('fade-out');
                            setTimeout(() => btn.remove(), 400);
                        };
                        btn.addEventListener('pointerenter', vanish, { once: true });
                        btn.addEventListener('pointerover', vanish, { once: true });
                        btn.addEventListener('touchstart', vanish, { once: true, passive: true });
                    }

                    const handlePress = (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        if (clicked) return;
                        clicked = true;

                        state.lastAction = now();
                        state.lastCursorMove = now();
                        state.lastStateAdvance = now();
                        state.autoLookOverrideUntil = now() + 2000;

                        if (state.mode !== 'calm') setState('calm');

                        const answer = BUTTON_ANSWERS[btn.textContent];
                        log(`> ${btn.textContent}`, "warn", 0, true);
                        if (answer) {
                            logAnswer(answer);
                        } else if (Math.random() > 0.5) {
                            log(rnd(PHRASES.btnClick), "sys", 0, true);
                        }

                        triggerGlitch();
                        const cx = e.clientX || e.touches?.[0]?.clientX;
                        const cy = e.clientY || e.touches?.[0]?.clientY;
                        if (typeof cx === 'number' && typeof cy === 'number') spawnParticles(cx, cy);

                        btn.classList.add('fade-out');
                        setTimeout(() => btn.remove(), 400);
                    };

                    btn.addEventListener('pointerdown', handlePress);
                    // Fallback для старых браузеров
                    btn.addEventListener('touchstart', (e) => {
                        if (e.cancelable) e.preventDefault();
                        handlePress(e);
                    }, { passive: false });

                    document.body.appendChild(btn);

                    if (!isPanic) {
                        setTimeout(() => {
                            if (btn.parentNode && !clicked) {
                                btn.classList.add('fade-out');
                                setTimeout(() => btn.remove(), 400);
                            }
                        }, CONFIG.btnLife);
                    }
                }, delay);
            }

            // =====================================================
            // ЭФФЕКТЫ
            // =====================================================
            function triggerGlitch() {
                if (prefersReducedMotion) return;
                glitchOverlay.classList.remove('active');
                void glitchOverlay.offsetWidth;
                glitchOverlay.classList.add('active');
                setTimeout(() => glitchOverlay.classList.remove('active'), 420);
            }

            function spawnParticles(x, y) {
                if (prefersReducedMotion) return;
                for (let i = 0; i < 6; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 2.5;
                    p.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
                    document.body.appendChild(p);
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 60;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;
                    requestAnimationFrame(() => {
                        p.style.transition =
                            `transform ${1.1 + Math.random() * 0.5}s cubic-bezier(0.1, 0.8, 0.2, 1), ` +
                            `opacity ${1.1 + Math.random() * 0.5}s ease`;
                        p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
                        p.style.opacity = '0';
                    });
                    setTimeout(() => p.remove(), 1800);
                }
            }

            function spawnDust(count = isMobile ? 8 : 12) {
                if (prefersReducedMotion) return;
                for (let i = 0; i < count; i++) {
                    const d = document.createElement('div');
                    d.className = 'dust';
                    d.style.left = `${Math.random() * 100}%`;
                    d.style.top = `${Math.random() * 100}%`;
                    d.style.setProperty('--dx', `${(Math.random() - 0.5) * 60}px`);
                    d.style.setProperty('--dy', `${(Math.random() - 0.5) * 60 - 20}px`);
                    d.style.animation = `dust-float ${8 + Math.random() * 10}s ease-in-out infinite`;
                    d.style.animationDelay = `${-Math.random() * 10}s`;
                    dustLayer.appendChild(d);
                }
            }

            function triggerSnow() {
                if (prefersReducedMotion) return;
                if (snowLayer.classList.contains('on')) return;
                snowLayer.classList.add('on');
                snowLayer.innerHTML = '';
                const count = isMobile ? 14 : 22;
                for (let i = 0; i < count; i++) {
                    const f = document.createElement('div');
                    f.className = 'snowflake';
                    const size = 1.5 + Math.random() * 2.5;
                    f.style.width = `${size}px`;
                    f.style.height = `${size}px`;
                    f.style.left = `${Math.random() * 100}%`;
                    f.style.setProperty('--sway', `${(Math.random() - 0.5) * 120}px`);
                    f.style.animation = `snow-fall ${8 + Math.random() * 6}s linear infinite`;
                    f.style.animationDelay = `${-Math.random() * 8}s`;
                    snowLayer.appendChild(f);
                }
                setTimeout(() => {
                    snowLayer.classList.remove('on');
                    snowLayer.innerHTML = '';
                }, 22000);
            }

            function triggerAsh() {
                if (prefersReducedMotion) return;
                if (ashLayer.classList.contains('on')) return;
                ashLayer.classList.add('on');
                ashLayer.innerHTML = '';
                const count = isMobile ? 12 : 18;
                for (let i = 0; i < count; i++) {
                    const a = document.createElement('div');
                    a.className = 'ash';
                    a.style.left = `${Math.random() * 100}%`;
                    a.style.setProperty('--sway', `${(Math.random() - 0.5) * 80}px`);
                    a.style.animation = `ash-fall ${10 + Math.random() * 8}s linear infinite`;
                    a.style.animationDelay = `${-Math.random() * 10}s`;
                    ashLayer.appendChild(a);
                }
                setTimeout(() => {
                    ashLayer.classList.remove('on');
                    ashLayer.innerHTML = '';
                }, 28000);
            }

            // =====================================================
            // ВИДИМОСТЬ
            // =====================================================
            document.addEventListener('visibilitychange', () => {
                state.isPageVisible = !document.hidden;
                if (document.hidden) {
                    state.lastAction = now();
                    state.queue = [];
                    state.priorityQueue = [];
                    state.typing = false;
                    state.typingAbort = false;
                } else {
                    setTimeout(() => {
                        if (!state.blinking) {
                            eyelid.classList.add('closing');
                            setTimeout(() => eyelid.classList.remove('closing'), 145);
                        }
                    }, 220);
                    log("Ты вернулся.", "ok", 400, true);
                    state.lastAction = now();
                    state.lastCursorMove = now();
                    state.lastStateAdvance = now();
                    if (state.mode === 'panic' || state.mode === 'paranoid' || state.mode === 'anxious') {
                        setState('calm');
                    } else if (state.mode === 'watchful') {
                        setState('curious');
                    }
                }
            });

            // =====================================================
            // СТАРТ
            // =====================================================
            const INTROS = {
                quiet: ["Соединение установлено.", "Наблюдение начато.", "Я здесь."],
                watchful: ["Канал открыт.", "Я слежу.", "Не бойся."],
                curious: ["Ты здесь.", "Интересно.", "Я ждал тебя."],
                lonely: ["Соединение установлено.", "Ты — первый за долгое время.", "Пожалуйста, останься."],
            };

            setTimeout(() => {
                log("Соединение установлено.", "sys");
                INTROS[state.personality].forEach((line, i) =>
                    log(line, i === 0 ? "sys" : "active", 700 + i * 600)
                );
            }, 500);

            spawnDust();
            scheduleBlink();
            scheduleSakkad();
            scheduleAutoLook();
            requestAnimationFrame(startEyeLoop);
            setInterval(tickStates, 1000);

            // Защита
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                triggerGlitch();
                log("копирование запрещено.", "err", 0, true);
            });

            // Дополнительная защита от случайного pull-to-refresh на мобиле
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

        })();
    </script>
</body>
</html>
