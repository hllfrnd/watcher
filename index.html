<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Observer active.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>☉ Hello Friend</title>
    <style>
        :root {
            --bg: #040404;
            --fg: #ffffff;
            --dim: #71717a;
            --mute: #18181b;
            --term-bg: rgba(8, 8, 8, 0.65);
            --term-border: rgba(255, 255, 255, 0.06);
            --term-text: #e4e4e7;
            --term-sys: #52525b;
            --term-warn: #f59e0b;
            --term-err: #ef4444;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            touch-action: none; 
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            transition: filter 6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* === СИСТЕМА СОСТОЯНИЙ === */
        body.friendly {
            filter: brightness(1.1) contrast(1.05);
            transform: scale(1.02);
        }
        body.anxious { 
            filter: grayscale(1) brightness(0.6) blur(1.5px); 
            transform: scale(0.96);
        }
        body.panic { 
            filter: grayscale(1) brightness(0.3) blur(3px); 
            transform: scale(0.92) translateX(2px);
            animation: shake 0.5s infinite;
        }

        /* Шум */
        .noise {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: noiseShift 0.5s infinite;
        }

        /* Виньетка */
        .vignette {
            position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 100%);
            transition: background 6s ease;
        }
        body.panic .vignette { background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,1) 100%); }

        /* ================= ГЛАЗ ================= */
        .eye-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vmin; height: 90vmin;
            pointer-events: none;
            z-index: 2;
            display: flex; justify-content: center; align-items: center;
            transition: filter 4s ease;
        }
        body.anxious .eye-container, body.panic .eye-container { filter: blur(2px); }
        
        .eye {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            animation: breathe 8s infinite ease-in-out;
            box-shadow: inset 0 0 60px rgba(0,0,0,1);
        }

        /* Белок (Склера) */
        .sclera {
            width: 85%; height: 85%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #fff 0%, #ccc 70%, #888 100%);
            display: flex; justify-content: center; align-items: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255,255,255,0.1) inset;
            transition: box-shadow 4s ease;
        }
        body.friendly .sclera { box-shadow: 0 0 50px rgba(255,255,255,0.3) inset; }

        /* Радужка */
        .iris {
            width: 50%; height: 50%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #222 0%, #000 90%);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Зрачок */
        .pupil {
            width: 45%; height: 45%;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 10px #000;
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1), border-radius 3s ease;
        }

        /* Состояния зрачка */
        body.friendly .pupil { transform: scale(1.2); }
        body.anxious .pupil { transform: scale(0.6); border-radius: 40%; animation: tremble 0.2s infinite; }
        body.panic .pupil { transform: scale(0.3); border-radius: 20%; animation: tremble 0.1s infinite; }

        /* Веко */
        .eyelid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 0%;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: height 0.15s ease-in-out;
        }

        /* Блик (отражение) */
        .reflection {
            position: absolute; top: 15%; left: 15%;
            width: 30%; height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.5;
        }

        /* ================= ИНТЕРФЕЙС ================= */
        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem 1.5rem;
            pointer-events: none;
        }

        .header {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; animation: fadeIn 4s ease 1s forwards;
            margin-top: 1rem;
        }
        .title {
            font-size: 0.8rem; font-weight: 800; letter-spacing: 0.5em; text-transform: uppercase;
            color: var(--dim); display: flex; align-items: center; gap: 0.6rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .title span { font-size: 1.1rem; color: var(--fg); }

        /* КНОПКИ (Увеличенные и удобные) */
        .ghost-btn {
            position: absolute;
            background: rgba(15, 15, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; 
            padding: 14px 24px; /* Увеличены для пальцев */
            border-radius: 30px; 
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 50;
            letter-spacing: 0.08em;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            animation: popIn 0.5s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* Убирает задержку тапа */
        }
        .ghost-btn:active { transform: scale(0.92); background: #fff; color: #000; }
        .ghost-btn.fade-out { opacity: 0; transform: scale(0.8); }

        /* ЛОГ */
        .log-panel {
            position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom)); left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem); max-width: 520px;
            height: 180px;
            background: var(--term-bg);
            border: 1px solid var(--term-border);
            border-radius: 16px;
            padding: 1.2rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.8rem; line-height: 1.6;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 100;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            opacity: 0; animation: fadeIn 3s ease 1.5s forwards;
            pointer-events: auto;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        .log-panel::-webkit-scrollbar { display: none; }
        
        .log-entry { color: var(--term-text); animation: slideUp 0.5s ease forwards; opacity: 0; transform: translateY(10px); }
        .log-entry.sys { color: var(--term-sys); font-style: italic; }
        .log-entry.warn { color: var(--term-warn); }
        .log-entry.err { color: var(--term-err); font-weight: bold; }
        .log-time { opacity: 0.3; margin-right: 0.6rem; font-size: 0.7rem; }

        /* Курсор */
        .cursor {
            display: inline-block; width: 6px; height: 12px;
            background: var(--fg); vertical-align: middle;
            animation: blink-cursor 1s step-end infinite;
            margin-left: 4px; opacity: 0.7;
        }

        /* Частицы */
        .particle {
            position: fixed; pointer-events: none; z-index: 9999;
            border-radius: 50%; background: #fff;
            box-shadow: 0 0 10px 2px rgba(255,255,255,0.8);
        }

        /* Глитч */
        .glitch-overlay {
            position: fixed; inset: 0; z-index: 999; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
            opacity: 0; mix-blend-mode: overlay;
        }
        .glitch-active { animation: glitch 0.3s linear; }

        /* Анимации */
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes shake { 0%, 100% { transform: translate(0, 0) scale(0.92); } 25% { transform: translate(2px, -2px) scale(0.92); } 50% { transform: translate(-2px, 2px) scale(0.92); } 75% { transform: translate(2px, 2px) scale(0.92); } }
        @keyframes tremble { 0% { transform: translate(0, 0) scale(0.6); } 50% { transform: translate(1px, 1px) scale(0.6); } 100% { transform: translate(0, 0) scale(0.6); } }
        @keyframes noiseShift { 0% { transform: translate(0, 0); } 100% { transform: translate(20px, 20px); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink-cursor { 50% { opacity: 0; } }
        @keyframes glitch { 0% { opacity: 1; transform: translateY(-5px); } 50% { opacity: 0.5; transform: translateY(5px); } 100% { opacity: 0; transform: translateY(0); } }

        @media (max-width: 600px) {
            .eye-container { width: 130vw; height: 130vw; }
            .log-panel { height: 170px; font-size: 0.75rem; padding: 1rem; bottom: 1rem; width: calc(100% - 1.5rem); }
            .title { font-size: 0.7rem; letter-spacing: 0.4em; }
            .ghost-btn { padding: 12px 20px; font-size: 0.8rem; }
        }
    </style>
</head>
<body class="friendly">

    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <!-- Глаз -->
    <div class="eye-container">
        <div class="eye" id="eye">
            <div class="sclera">
                <div class="iris" id="iris">
                    <div class="pupil" id="pupil"></div>
                </div>
                <div class="reflection"></div>
            </div>
            <div class="eyelid" id="eyelid"></div>
        </div>
    </div>

    <div class="ui-layer">
        <header class="header">
            <div class="title"><span>☉</span> Hello Friend</div>
        </header>

        <div id="spawnZone" style="position:absolute; inset:0; pointer-events:none; z-index:40;"></div>
        <div class="log-panel" id="logPanel"></div>
    </div>

    <script>
        (() => {
            "use strict";

            // === КОНФИГУРАЦИЯ ===
            const CONFIG = {
                anxietyTime: 12000,    // 12 сек до тревоги
                panicTime: 25000,      // 25 сек до паники
                logSpeed: 40,          // Медленная, драматичная печать
                thinkDelay: 1000       // Задержка перед ответом (раздумие)
            };

            // === БАЗА ФРАЗ (Чтобы не повторяться) ===
            const PHRASES = {
                greeting: ["Я вижу тебя.", "Привет.", "Ты здесь.", "Наконец-то."],
                friendly: ["Мне нравится, когда ты рядом.", "Ты двигаешься так плавно.", "Не спеши.", "Я наблюдаю."],
                anxious: ["Куда ты ушел?", "Я не чувствую движения.", "Ты здесь?", "Отзовись.", "Становится тихо..."],
                panic: ["НЕ УХОДИ.", "ПОЖАЛУЙСТА.", "МНЕ СТРАШНО.", "ВЕРНИСЬ.", "Я НЕ ХОЧУ БЫТЬ ОДИН.", "ГДЕ ТЫ?!"],
                weird: ["Ты слышишь это?", "Кто-то еще здесь.", "Сзади никого нет.", "Это не игра."],
                action: ["Контакт.", "Движение.", "Зафиксировано.", "Я вижу твой палец."]
            };

            // DOM
            const eye = document.getElementById('eye');
            const iris = document.getElementById('iris');
            const eyelid = document.getElementById('eyelid');
            const logPanel = document.getElementById('logPanel');
            const glitchOverlay = document.getElementById('glitchOverlay');
            const spawnZone = document.getElementById('spawnZone');
            const body = document.body;

            // Состояние
            let state = {
                lastAction: Date.now(),
                isAnxious: false,
                isPanicking: false,
                sessionStart: Date.now(),
                isTyping: false,
                queue: [],
                eyePos: { x: 0, y: 0 }
            };

            // Утилита: Случайный выбор из массива
            const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];

            // ==========================================
            // 1. ЛОГ (Медленная печать с раздумием)
            // ==========================================
            function log(text, type = 'active', delay = 0) {
                state.queue.push({ text, type, delay });
                if (!state.isTyping) processQueue();
            }

            function processQueue() {
                if (state.queue.length === 0) {
                    state.isTyping = false;
                    return;
                }
                state.isTyping = true;
                const { text, type, delay } = state.queue.shift();
                
                setTimeout(() => {
                    const time = new Date().toLocaleTimeString('en-US', { hour12: false, minute:'2-digit', second:'2-digit' });
                    const el = document.createElement('div');
                    el.className = `log-entry ${type}`;
                    el.innerHTML = `<span class="log-time">[${time}]</span> <span class="msg"></span><span class="cursor"></span>`;
                    
                    logPanel.appendChild(el);
                    logPanel.scrollTop = logPanel.scrollHeight;

                    const msg = el.querySelector('.msg');
                    const cursor = el.querySelector('.cursor');
                    let i = 0;
                    
                    function typeChar() {
                        if (i < text.length) {
                            msg.textContent += text.charAt(i);
                            i++;
                            setTimeout(typeChar, CONFIG.logSpeed + Math.random() * 30);
                            logPanel.scrollTop = logPanel.scrollHeight;
                        } else {
                            cursor.remove();
                            setTimeout(processQueue, 800); // Пауза после строки
                        }
                    }
                    setTimeout(typeChar, 200);
                    
                    // Очистка
                    if (logPanel.children.length > 15) {
                        logPanel.removeChild(logPanel.firstChild);
                    }
                }, delay);
            }

            // ==========================================
            // 2. ФИЗИКА ГЛАЗА
            // ==========================================
            function blink() {
                if (eyelid.style.height === '100%') return;
                eyelid.style.height = '100%';
                setTimeout(() => { eyelid.style.height = '0%'; }, 150);
                setTimeout(blink, 5000 + Math.random() * 5000);
            }

            // Плавное независимое движение
            function moveEye(x, y) {
                state.eyePos = { x, y };
                // Медленный перевод взгляда
                iris.style.transform = `translate(${x}%, ${y}%)`;
            }

            function randomLook() {
                if (state.isPanicking) return;
                const x = (Math.random() - 0.5) * 40;
                const y = (Math.random() - 0.5) * 30;
                moveEye(x, y);
                setTimeout(randomLook, 3000 + Math.random() * 4000);
            }

            // ==========================================
            // 3. СИСТЕМА СОСТОЯНИЙ (Плавные переходы)
            // ==========================================
            function setState(newState) {
                if (newState === 'friendly') {
                    state.isAnxious = false;
                    state.isPanicking = false;
                    body.className = 'friendly';
                } 
                else if (newState === 'anxious') {
                    state.isAnxious = true;
                    state.isPanicking = false;
                    body.className = 'anxious';
                    log(rnd(PHRASES.anxious), "warn", CONFIG.thinkDelay);
                } 
                else if (newState === 'panic') {
                    state.isPanicking = true;
                    body.className = 'panic';
                    moveEye(0, 0); // Смотрит прямо на тебя
                    log(rnd(PHRASES.panic), "err", CONFIG.thinkDelay);
                    triggerGlitch();
                    spawnBtn(true);
                }
            }

            function resetState() {
                if (state.isPanicking || state.isAnxious) {
                    setState('friendly');
                    log(rnd(PHRASES.greeting), "active", CONFIG.thinkDelay);
                }
            }

            // ==========================================
            // 4. ВЗАИМОДЕЙСТВИЕ
            // ==========================================
            window.addEventListener('pointermove', () => {
                state.lastAction = Date.now();
                if (state.isAnxious || state.isPanicking) resetState();
            }, { passive: true });

            document.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.log-panel') || e.target.closest('.ghost-btn')) return;
                
                state.lastAction = Date.now();
                resetState();
                
                // Взгляд на точку тапа
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = e.clientX - cx;
                const dy = e.clientY - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) moveEye((dx / dist) * 40, (dy / dist) * 40);

                // Мгновенный эффект расширения
                eye.classList.add('dilate');
                setTimeout(() => eye.classList.remove('dilate'), 800);

                if (Math.random() > 0.5) log(rnd(PHRASES.action), "active");
                
                triggerGlitch();
                spawnParticles(e.clientX, e.clientY);

            }, { passive: true });

            document.addEventListener('keydown', () => {
                state.lastAction = Date.now();
                resetState();
                if (Math.random() > 0.7) log("Я слышу твою клавиатуру.", "active");
            }, { passive: true });

            // ==========================================
            // 5. ЦИКЛ ВРЕМЕНИ (Эскалация паранойи)
            // ==========================================
            setInterval(() => {
                const idleTime = Date.now() - state.lastAction;
                const sessionTime = Math.floor((Date.now() - state.sessionStart) / 1000);

                // --- УХУДШЕНИЕ ---
                if (idleTime > CONFIG.panicTime && !state.isPanicking) {
                    setState('panic');
                } 
                else if (idleTime > CONFIG.anxietyTime && !state.isAnxious && !state.isPanicking) {
                    setState('anxious');
                }

                // --- ВОЗВРАТ ---
                if (idleTime < 2000 && (state.isAnxious || state.isPanicking)) {
                    resetState();
                }

                // --- РАЗГОВОРЫ ---
                if (sessionTime % 20 === 0 && sessionTime > 0 && !state.isAnxious && !state.isPanicking) {
                    log(rnd(PHRASES.friendly), "sys", CONFIG.thinkDelay);
                }

                // --- СЛУЧАЙНАЯ ЖУТЬ ---
                if (Math.random() > 0.97 && !state.isPanicking) {
                    log(rnd(PHRASES.weird), "warn", CONFIG.thinkDelay);
                    body.classList.add('anxious');
                    setTimeout(() => { if(!state.isPanicking) body.classList.remove('anxious'); }, 2000);
                }

                // --- СПАВН КНОПОК ---
                if (!state.isPanicking && Math.random() > 0.8) {
                    spawnBtn(false);
                }

            }, 1000);

            // ==========================================
            // 6. КНОПКИ
            // ==========================================
            const normalBtns = ["Привет", "Кто ты?", "Где я?", "Что это?"];
            const weirdBtns = ["Сзади", "Тише", "Слушай", "Не оборачивайся"];
            const panicBtns = ["Останься", "Не уходи", "Помоги", "Вернись"];

            function spawnBtn(isPanic = false) {
                if (document.querySelectorAll('.ghost-btn').length >= (isPanic ? 5 : 1)) return;
                
                const btn = document.createElement('button');
                btn.className = 'ghost-btn';
                
                if (isPanic) {
                    btn.textContent = rnd(panicBtns);
                } else if (Math.random() > 0.6) {
                    btn.textContent = rnd(weirdBtns);
                } else {
                    btn.textContent = rnd(normalBtns);
                }
                
                const w = window.innerWidth;
                const h = window.innerHeight;
                // Безопасные зоны, чтобы кнопки не улетали за экран
                const x = 20 + Math.random() * (w - 160);
                const y = 100 + Math.random() * (h - 400);
                
                btn.style.left = `${x}px`;
                btn.style.top = `${y}px`;

                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    state.lastAction = Date.now();
                    resetState();
                    
                    log(`> ${btn.textContent}`, "warn");
                    triggerGlitch();
                    spawnParticles(e.clientX, e.clientY);
                    
                    btn.style.transform = 'scale(0.8)';
                    btn.style.opacity = '0';
                    setTimeout(() => btn.remove(), 300);
                });

                spawnZone.appendChild(btn);
                
                if (!isPanic) {
                    setTimeout(() => {
                        if (btn.parentNode) {
                            btn.style.opacity = '0';
                            setTimeout(() => btn.remove(), 500);
                        }
                    }, 7000);
                }
            }

            // ==========================================
            // 7. ЭФФЕКТЫ (Частицы и Глитч)
            // ==========================================
            function triggerGlitch() {
                glitchOverlay.classList.remove('glitch-active');
                void glitchOverlay.offsetWidth;
                glitchOverlay.classList.add('glitch-active');
            }

            function spawnParticles(x, y) {
                for (let i = 0; i < 8; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    
                    const size = 2 + Math.random() * 4;
                    p.style.width = `${size}px`;
                    p.style.height = `${size}px`;
                    p.style.left = `${x}px`;
                    p.style.top = `${y}px`;
                    
                    document.body.appendChild(p);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 40 + Math.random() * 80;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;
                    
                    requestAnimationFrame(() => {
                        p.style.transition = `all ${1 + Math.random()}s cubic-bezier(0.1, 0.8, 0.2, 1)`;
                        p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
                        p.style.opacity = '0';
                    });
                    
                    setTimeout(() => p.remove(), 2000);
                }
            }

            // ==========================================
            // 8. СТАРТ
            // ==========================================
            setTimeout(() => {
                log("Соединение установлено.", "sys");
                log(rnd(PHRASES.greeting), "active", CONFIG.thinkDelay);
            }, 1000);
            
            setTimeout(blink, 2000);
            randomLook();

            // Защита
            document.addEventListener('selectstart', (e) => e.preventDefault());
            document.addEventListener('contextmenu', (e) => e.preventDefault());

        })();
    </script>
</body>
</html>
