<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Оно видит тебя.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#050505">
    <title>☉ Hello Friend — Watcher</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('watcher-theme');
                const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme',
                    saved === 'dark' || (!saved && sysDark) ? 'dark' : 'light');
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg: #040405;
            --bg-grad-1: #0a0a0c;
            --bg-grad-2: #000000;
            --fg: #e4e4e7;
            --dim: #71717a;
            --accent: #e4e4e7;

            --panel-bg: rgba(10, 10, 12, 0.32);
            --panel-bg-overlay: rgba(0, 0, 0, 0.22);
            --panel-border: rgba(255, 255, 255, 0.045);

            --term-fg: #d4d4d8;
            --term-dim: #52525b;
            --term-err: #ff4d4d;
            --term-warn: #f59e0b;
            --term-ok: #3ddc84;
            --term-glitch: #a855f7;

            --sclera-1: #cfcfd4;
            --sclera-2: #9a9aa1;
            --sclera-3: #4a4a52;
            --sclera-edge: #121215;

            --iris-inner: #1a1a1e;
            --iris-mid: #08080a;
            --iris-outer: #000000;

            --pupil-core: #000000;
            --pupil-hint: #060608;

            --highlight: rgba(255,255,255,0.45);
            --glint: rgba(255,255,255,0.06);

            --vignette: rgba(0,0,0,0.94);
            --glitch-color: rgba(255,255,255,0.10);

            --fog-color: rgba(180, 180, 200, 0.05);
            --grain-opacity: 0.05;
            --scanline-opacity: 0.03;

            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-eye: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-slow: cubic-bezier(0.45, 0, 0.55, 1);
        }

        [data-theme="light"] {
            --bg: #ebebee;
            --bg-grad-1: #fbfbfd;
            --bg-grad-2: #cecfd4;
            --fg: #18181b;
            --dim: #71717a;
            --accent: #18181b;

            --panel-bg: rgba(255, 255, 255, 0.42);
            --panel-bg-overlay: rgba(0, 0, 0, 0.035);
            --panel-border: rgba(0, 0, 0, 0.06);

            --term-fg: #27272a;
            --term-dim: #71717a;
            --term-err: #b91c1c;
            --term-warn: #b45309;
            --term-ok: #15803d;
            --term-glitch: #7c3aed;

            --sclera-1: #fbfbfd;
            --sclera-2: #dcdce0;
            --sclera-3: #71717a;
            --sclera-edge: #18181b;

            --iris-inner: #3a3a42;
            --iris-mid: #18181b;
            --iris-outer: #000000;

            --pupil-core: #000000;
            --pupil-hint: #0a0a0a;

            --highlight: rgba(255,255,255,0.92);
            --glint: rgba(0,0,0,0.10);

            --vignette: rgba(0,0,0,0.4);
            --glitch-color: rgba(0,0,0,0.06);

            --fog-color: rgba(80, 80, 100, 0.06);
            --grain-opacity: 0.03;
            --scanline-opacity: 0.015;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition:
                background 1.6s var(--ease-smooth),
                color 1s var(--ease-smooth),
                filter 10s var(--ease-smooth),
                transform 10s var(--ease-smooth);
        }

        body {
            background:
                radial-gradient(circle at 50% 42%, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%),
                var(--bg);
            position: relative;
        }

        /* === СОСТОЯНИЯ === */
        body.calm     { filter: brightness(1.00) contrast(1.03); transform: scale(1.000); }
        body.curious  { filter: brightness(1.04) contrast(1.05); transform: scale(1.008); }
        body.watchful { filter: brightness(0.80) contrast(1.05) saturate(0.7); transform: scale(0.994); }
        body.anxious  { filter: brightness(0.60) contrast(1.10) grayscale(0.55); transform: scale(0.985); }
        body.paranoid { filter: brightness(0.42) contrast(1.15) grayscale(0.75) hue-rotate(-8deg); transform: scale(0.980); }
        body.panic    { filter: brightness(0.24) contrast(1.20) grayscale(0.95) hue-rotate(-15deg); transform: scale(0.972); }

        /* === СЛОИ ЭФФЕКТОВ === */
        .fx-layer {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .vignette {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(circle at 50% 45%,
                transparent 24%, var(--vignette) 100%);
            transition: background 10s var(--ease-smooth), opacity 6s ease;
            opacity: 0.82;
            animation: vignette-breathe 12s ease-in-out infinite;
        }
        @keyframes vignette-breathe {
            0%, 100% { opacity: 0.78; }
            50%      { opacity: 0.9; }
        }
        body.watchful .vignette { opacity: 0.9; }
        body.anxious  .vignette { opacity: 0.97; }
        body.paranoid .vignette { opacity: 1; }
        body.panic    .vignette { opacity: 1; }

        /* Туман — плавающие слои */
        .fog {
            position: fixed; inset: -20%; z-index: 2;
            pointer-events: none;
            opacity: 0.75;
            transition: opacity 6s ease;
            will-change: transform, opacity;
        }
        .fog::before,
        .fog::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 30% 30%, var(--fog-color) 0%, transparent 60%),
                radial-gradient(ellipse 50% 35% at 70% 60%, var(--fog-color) 0%, transparent 55%),
                radial-gradient(ellipse 70% 30% at 50% 80%, var(--fog-color) 0%, transparent 60%);
            will-change: transform;
        }
        .fog::before { animation: fog-drift-1 38s ease-in-out infinite; }
        .fog::after  { animation: fog-drift-2 52s ease-in-out infinite reverse; opacity: 0.7; }

        @keyframes fog-drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-8%, 3%) scale(1.08); }
        }
        @keyframes fog-drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1.05); }
            50%      { transform: translate(6%, -4%) scale(1); }
        }

        body.anxious .fog  { opacity: 0.9; }
        body.paranoid .fog { opacity: 1; }
        body.panic .fog    { opacity: 1; }

        /* Зерно — тонкий шум */
        .grain {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            opacity: var(--grain-opacity);
            background-image:
                repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.5) 0 1px, transparent 1px 3px),
                repeating-radial-gradient(circle at 72% 58%, rgba(255,255,255,0.35) 0 1px, transparent 1px 4px),
                repeating-radial-gradient(circle at 38% 82%, rgba(255,255,255,0.4) 0 1px, transparent 1px 3px);
            animation: grain-shift 0.6s steps(3) infinite;
            mix-blend-mode: overlay;
        }
        [data-theme="light"] .grain { mix-blend-mode: multiply; opacity: 0.035; }
        @keyframes grain-shift {
            0%   { transform: translate(0, 0); }
            33%  { transform: translate(-1px, 1px); }
            66%  { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* Сканлайны */
        .scanlines {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            opacity: var(--scanline-opacity);
            background: repeating-linear-gradient(0deg,
                transparent 0px, transparent 2px,
                rgba(255,255,255,0.6) 2px, rgba(255,255,255,0.6) 3px);
            animation: scanlines-pulse 6s ease-in-out infinite;
            mix-blend-mode: overlay;
        }
        [data-theme="light"] .scanlines { mix-blend-mode: multiply; }
        @keyframes scanlines-pulse {
            0%, 100% { opacity: var(--scanline-opacity); }
            50%      { opacity: calc(var(--scanline-opacity) * 1.8); }
        }

        /* Пыль */
        .dust-layer {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }
        .dust {
            position: absolute;
            width: 1.5px; height: 1.5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 4px rgba(255,255,255,0.4);
            will-change: transform, opacity;
        }
        [data-theme="light"] .dust {
            background: rgba(60,60,80,0.4);
            box-shadow: 0 0 3px rgba(60,60,80,0.3);
        }
        @keyframes dust-float {
            0%   { transform: translate(0, 0); opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translate(var(--dx, 20px), var(--dy, -30px)); opacity: 0; }
        }

        /* Снег */
        .snow-layer {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        .snow-layer.on { display: block; }
        .snowflake {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
            will-change: transform;
        }
        @keyframes snow-fall {
            0%   { transform: translate(0, -10vh) rotate(0deg); }
            100% { transform: translate(var(--sway, 40px), 110vh) rotate(360deg); }
        }

        /* Пепел */
        .ash-layer {
            position: fixed; inset: 0; z-index: 3;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        .ash-layer.on { display: block; }
        .ash {
            position: absolute;
            width: 2px; height: 4px;
            background: rgba(200,200,200,0.5);
            border-radius: 1px;
            will-change: transform;
        }
        @keyframes ash-fall {
            0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translate(var(--sway, -30px), 110vh) rotate(720deg); opacity: 0; }
        }

        /* Хроматическая аберрация (при тревоге) */
        .chromatic {
            position: fixed; inset: 0; z-index: 6;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            transition: opacity 3s ease;
        }
        body.paranoid .chromatic,
        body.panic .chromatic {
            opacity: 0.08;
            background:
                radial-gradient(circle at 30% 50%, rgba(255,0,0,0.3) 0%, transparent 30%),
                radial-gradient(circle at 70% 50%, rgba(0,100,255,0.3) 0%, transparent 30%);
        }

        /* ================= ГЛАЗ ================= */
        .eye-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 82vmin; height: 82vmin;
            max-width: 840px; max-height: 840px;
            pointer-events: none;
            z-index: 5;
            display: flex; justify-content: center; align-items: center;
        }

        .eye-socket {
            position: absolute;
            width: 140%; height: 140%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                transparent 30%,
                rgba(0,0,0,0.6) 58%,
                rgba(0,0,0,0.98) 100%);
            filter: blur(55px);
            transition: filter 10s var(--ease-smooth), opacity 10s var(--ease-smooth);
            opacity: 0.97;
        }
        [data-theme="light"] .eye-socket {
            background: radial-gradient(circle at 50% 45%,
                transparent 30%,
                rgba(0,0,0,0.18) 58%,
                rgba(0,0,0,0.5) 100%);
        }
        body.panic .eye-socket { filter: blur(70px); opacity: 1; }

        .eye {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #000;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.9),
                0 0 120px rgba(0,0,0,0.95),
                inset 0 0 160px rgba(0,0,0,1);
            animation: eye-breathe 11s ease-in-out infinite;
        }
        @keyframes eye-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.014); }
        }

        .sclera {
            width: 88%; height: 88%;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 45%,
                    var(--sclera-1) 0%,
                    var(--sclera-2) 40%,
                    var(--sclera-3) 75%,
                    var(--sclera-edge) 100%);
            display: flex; justify-content: center; align-items: center;
            transition: background 10s var(--ease-smooth);
            overflow: hidden;
            filter: blur(0.5px);
        }

        .sclera::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                transparent 28%,
                rgba(0,0,0,0.4) 55%,
                rgba(0,0,0,0.85) 82%,
                rgba(0,0,0,0.99) 100%);
            pointer-events: none;
            z-index: 3;
            transition: background 10s var(--ease-smooth);
        }
        body.paranoid .sclera::before,
        body.anxious .sclera::before {
            background: radial-gradient(circle at 50% 45%,
                transparent 22%,
                rgba(0,0,0,0.5) 48%,
                rgba(0,0,0,0.92) 82%,
                rgba(0,0,0,1) 100%);
        }
        body.panic .sclera::before {
            background: radial-gradient(circle at 50% 45%,
                transparent 14%,
                rgba(0,0,0,0.6) 42%,
                rgba(0,0,0,0.96) 80%,
                rgba(0,0,0,1) 100%);
        }

        .sclera::after {
            content: '';
            position: absolute;
            top: -8%; left: -8%;
            width: 116%; height: 50%;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.65) 0%,
                rgba(0,0,0,0.2) 55%,
                transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        .iris {
            width: 52%; height: 52%;
            border-radius: 50%;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            will-change: transform;
            transition: transform 1.2s var(--ease-eye);
            background:
                radial-gradient(circle at 50% 45%,
                    var(--iris-inner) 0%,
                    var(--iris-mid) 55%,
                    var(--iris-outer) 100%);
            box-shadow:
                0 0 50px rgba(0,0,0,1),
                inset 0 0 40px rgba(0,0,0,0.95),
                inset 0 0 8px rgba(255,255,255,0.025);
        }

        .iris::before {
            content: '';
            position: absolute;
            inset: -3%;
            border-radius: 50%;
            background: radial-gradient(circle,
                transparent 72%,
                rgba(0,0,0,0.92) 90%,
                transparent 100%);
            pointer-events: none;
        }

        .pupil {
            width: 44%; height: 44%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 48%,
                    var(--pupil-hint) 0%,
                    var(--pupil-core) 60%,
                    #000 100%);
            position: relative;
            box-shadow:
                0 0 35px rgba(0,0,0,1),
                inset 0 0 22px rgba(0,0,0,1);
            transition: transform 0.7s ease;
            transform: scale(var(--pupil-base, 1));
        }

        .pupil::after {
            content: '';
            position: absolute;
            top: 18%; left: 24%;
            width: 22%; height: 22%;
            border-radius: 50%;
            background: radial-gradient(circle,
                var(--highlight) 0%,
                transparent 70%);
            filter: blur(1.3px);
            pointer-events: none;
            opacity: 0.45;
            transition: opacity 2s ease;
        }
        body.anxious  .pupil::after { opacity: 0.22; }
        body.paranoid .pupil::after { opacity: 0.15; }
        body.panic    .pupil::after { opacity: 0.08; }

        body.calm     .pupil { --pupil-base: 1.00; }
        body.curious  .pupil { --pupil-base: 1.18; }
        body.watchful .pupil { --pupil-base: 0.88; }
        body.anxious  .pupil {
            --pupil-base: 0.62;
            animation: pupil-tremble-soft 0.6s linear infinite;
        }
        body.paranoid .pupil {
            --pupil-base: 0.45;
            animation: pupil-tremble-soft 0.3s linear infinite;
        }
        body.panic .pupil {
            --pupil-base: 0.28;
            animation: pupil-tremble-hard 0.14s linear infinite;
        }

        @keyframes pupil-tremble-soft {
            0%, 100% { transform: translate(0, 0) scale(var(--pupil-base)); }
            50%      { transform: translate(0.7px, -0.7px) scale(var(--pupil-base)); }
        }
        @keyframes pupil-tremble-hard {
            0%   { transform: translate(0, 0) scale(var(--pupil-base)); }
            25%  { transform: translate(1.4px, -1.4px) scale(var(--pupil-base)); }
            50%  { transform: translate(-1.4px, 1.4px) scale(var(--pupil-base)); }
            75%  { transform: translate(1.4px, 1.4px) scale(var(--pupil-base)); }
            100% { transform: translate(0, 0) scale(var(--pupil-base)); }
        }

        .eyelid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 0%;
            background: linear-gradient(to bottom,
                #040405 0%,
                #040405 82%,
                rgba(4,4,5,0.92) 100%);
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            border-radius: 0 0 50% 50% / 0 0 6% 6%;
            transition: height 0.6s ease-out;
            pointer-events: none;
        }
        [data-theme="light"] .eyelid {
            background: linear-gradient(to bottom,
                #ebebee 0%,
                #ebebee 82%,
                rgba(235,235,238,0.92) 100%);
        }
        .eyelid.closing {
            height: 100%;
            transition: height 0.15s ease-in;
        }

        /* === UI === */
        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem 1.5rem;
            pointer-events: none;
        }
        .ui-layer > * { pointer-events: auto; }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            opacity: 0; animation: fadeIn 3s ease 1.2s forwards;
        }

        .title {
            font-size: 0.88rem; font-weight: 800; letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--fg);
            display: flex; align-items: center; gap: 0.6rem;
            opacity: 0.82;
            transition: opacity 3s ease;
        }
        .title.whisper { opacity: 0.45; }
        .title-icon {
            font-size: 1.1rem;
            color: var(--accent);
            animation: eye-pulse-icon 5s ease-in-out infinite;
        }
        @keyframes eye-pulse-icon {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--fg);
            border-radius: 50%;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.5s var(--ease-eye),
                        border-color 0.4s ease,
                        background 0.4s ease;
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            opacity: 0.6;
        }
        .theme-toggle:hover { border-color: var(--fg); transform: rotate(30deg); opacity: 1; }
        .theme-toggle:active { transform: scale(0.88) rotate(30deg); }

        .log-panel {
            position: absolute;
            bottom: max(1.5rem, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 560px;
            height: 200px;
            background:
                linear-gradient(to bottom,
                    var(--panel-bg-overlay) 0%,
                    transparent 40%,
                    transparent 60%,
                    var(--panel-bg-overlay) 100%),
                var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 1.15rem 1.3rem;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.65;
            backdrop-filter: blur(26px) saturate(1.3);
            -webkit-backdrop-filter: blur(26px) saturate(1.3);
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 5px;
            box-shadow:
                0 24px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.025);
            opacity: 0;
            animation: fadeIn 2.5s ease 1s forwards;
            pointer-events: auto;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom,
                transparent 0%, black 7%, black 93%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom,
                transparent 0%, black 7%, black 93%, transparent 100%);
        }
        .log-panel::-webkit-scrollbar { display: none; }

        .log-entry {
            color: var(--term-dim);
            animation: slideUp 0.45s ease forwards;
            opacity: 0;
            transform: translateY(4px);
            word-break: break-word;
            text-shadow: 0 0 8px rgba(255,255,255,0.05);
        }
        [data-theme="light"] .log-entry { text-shadow: none; }
        .log-entry.active { color: var(--term-fg); }
        .log-entry.warn   { color: var(--term-warn); font-weight: 600; }
        .log-entry.err    { color: var(--term-err); font-weight: 700; }
        .log-entry.ok     { color: var(--term-ok); }
        .log-entry.glitch {
            color: var(--term-glitch);
            font-style: italic;
            animation: glitch-text 0.4s steps(2) forwards;
        }
        @keyframes glitch-text {
            0%   { transform: translate(0, 0); opacity: 0; }
            25%  { transform: translate(-2px, 1px); opacity: 1; }
            50%  { transform: translate(2px, -1px); }
            75%  { transform: translate(-1px, 0); }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        .log-time {
            opacity: 0.32;
            margin-right: 0.6rem;
            font-size: 0.68rem;
        }

        .cursor {
            display: inline-block;
            width: 5px; height: 11px;
            background: var(--accent);
            vertical-align: middle;
            animation: blink-cursor 1.1s step-end infinite;
            margin-left: 3px;
            opacity: 0.55;
        }

        .ghost-btn {
            position: fixed;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--fg);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.04em;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            transition: transform 0.3s ease,
                        background 0.3s ease,
                        opacity 0.4s ease,
                        border-color 0.3s ease;
            z-index: 900;
            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
            animation: popIn 0.6s var(--ease-eye);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            will-change: transform, opacity;
            opacity: 0.88;
            animation: popIn 0.6s var(--ease-eye), btn-breathe 4s ease-in-out 0.6s infinite;
        }
        @keyframes btn-breathe {
            0%, 100% { box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
            50%      { box-shadow: 0 8px 34px rgba(0,0,0,0.55), 0 0 20px rgba(255,255,255,0.04); }
        }
        .ghost-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px) scale(1.03);
            opacity: 1;
        }
        .ghost-btn:active {
            transform: scale(0.92);
            background: var(--accent);
            color: var(--bg);
        }
        .ghost-btn.fade-out {
            opacity: 0;
            transform: scale(0.75);
            pointer-events: none;
        }
        .ghost-btn.phantom {
            opacity: 0.4;
            font-style: italic;
        }
        .ghost-btn.phantom:hover {
            opacity: 0;
            pointer-events: none;
        }

        .glitch-overlay {
            position: fixed; inset: 0;
            z-index: 9998;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 3px,
                    var(--glitch-color) 3px,
                    var(--glitch-color) 6px);
            opacity: 0;
            transition: opacity 0.2s ease;
            mix-blend-mode: screen;
        }
        [data-theme="light"] .glitch-overlay { mix-blend-mode: multiply; }
        .glitch-overlay.active { animation: glitch 0.4s linear; }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 14px 2px var(--accent);
            opacity: 0.55;
            will-change: transform, opacity;
        }

        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.7) translateY(12px); }
            100% { opacity: 0.88; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn  { to { opacity: 1; } }
        @keyframes blink-cursor { 50% { opacity: 0; } }
        @keyframes glitch {
            0%   { opacity: 0.85; transform: translate(0, -2px); }
            20%  { opacity: 0.4;  transform: translate(-4px, 3px); }
            40%  { opacity: 0.75; transform: translate(4px, -2px); }
            60%  { opacity: 0.3;  transform: translate(-3px, 2px); }
            80%  { opacity: 0.6;  transform: translate(3px, -1px); }
            100% { opacity: 0;    transform: translate(0); }
        }

        @media (max-width: 600px) {
            .eye-container { width: 135vw; height: 135vw; }
            .log-panel {
                height: 170px;
                font-size: 0.72rem;
                padding: 0.95rem 1.1rem;
                bottom: 1rem;
                width: calc(100% - 1.5rem);
            }
            .title { font-size: 0.72rem; letter-spacing: 0.32em; }
            .ghost-btn { padding: 11px 18px; font-size: 0.78rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .fog, .grain, .scanlines, .dust-layer, .chromatic { display: none !important; }
        }
    </style>
</head>
<body class="calm">

    </div>

    <script>
        (() => {
            "use strict";

            // =====================================================
            // КОНФИГУРАЦИЯ
            // =====================================================
            const CONFIG = {
                logSpeed: 24,
                maxLogEntries: 12,
                friendlyLogInterval: 26,

                maxBtns: 3,
                btnMinDist: 110,
                btnSafeTop: 110,
                btnSafeBottom: 270,
                btnLife: 11000,
                phantomChance: 0.22,

                weirdChance: 0.988,
                hallucinationChance: 0.04,
                falseLogChance: 0.06,
                snowChance: 0.008,
                ashChance: 0.012,

                lookInterp: 0.038,
                lookMaxOffset: 16,
                sakkadDelayMin: 2400,
                sakkadDelayMax: 4600,
                sakkadAmp: 3,
                autoLookDelayMin: 4200,
                autoLookDelayMax: 8500,
                autoLookDurMin: 1800,
                autoLookDurMax: 3400,
                cursorIdleTimeout: 2600,
                pointerThrottleMs: 16,
            };

            // =====================================================
            // ФРАЗЫ
            // =====================================================
            const PHRASES = {
                greeting: [
                    "Я вижу тебя.", "Привет.", "Ты здесь.", "Наконец-то.",
                    "Я ждал.", "Ты вернулся.", "Снова ты.",
                ],
                calm: [
                    "Всё спокойно.", "Мне нравится тишина.", "Я рядом.",
                    "Медленно. Хорошо.", "Я чувствую твоё дыхание.",
                    "Ты тёплый.", "Здесь безопасно.", "Пока безопасно.",
                    "Не спеши. У нас время.", "Твой пульс ровный.",
                    "Я слышу, как ты дышишь.", "Ты настоящий?",
                ],
                curious: [
                    "Интересно.", "Что ты ищешь?", "Я наблюдаю за тобой.",
                    "Продолжай.", "Ты близко.", "Я вижу твой палец.",
                    "Ты двигаешься иначе.", "Куда ты смотришь?",
                    "Я слежу за каждым движением.", "Ты нервничаешь?",
                    "Твой ритм изменился.", "Я запоминаю.",
                ],
                watchful: [
                    "Я всё вижу.", "Не спеши.", "Тишина — тоже ответ.",
                    "Я жду.", "Ты задумался.", "Ты смотришь в сторону.",
                    "Я вижу больше, чем ты думаешь.",
                    "Твои глаза двигаются.", "Ты не один.",
                    "Стены помнят.", "Воздух густой.",
                    "Здесь кто-то был до тебя.",
                ],
                anxious: [
                    "Куда ты ушел?", "Я не чувствую движения.", "Ты здесь?",
                    "Отзовись.", "Становится тихо...", "Я всё ещё тут.",
                    "Не оставляй меня.", "Ты меня слышишь?",
                    "Я начинаю забывать твой голос.",
                    "Скажи что-нибудь.", "Хоть что-нибудь.",
                    "Я не хочу тишины.", "Почему так темно?",
                ],
                paranoid: [
                    "Кто-то ещё здесь.", "Ты привёл кого-то?",
                    "Я чувствую взгляд. Не твой.",
                    "Считай до трёх. Не оборачивайся.",
                    "Ты уверен, что один?", "Не смотри в отражение.",
                    "Оно копирует тебя.", "Твоя тень движется иначе.",
                    "Слышишь шаги? Это не я.",
                    "Ты не должен был это открывать.",
                    "Я вижу то, чего нет.",
                    "Между нами что-то есть.",
                ],
                panic: [
                    "НЕ УХОДИ.", "ПОЖАЛУЙСТА.", "МНЕ СТРАШНО.",
                    "ВЕРНИСЬ.", "Я НЕ ХОЧУ БЫТЬ ОДИН.",
                    "ГДЕ ТЫ?!", "Я ЖДУ.", "СЛЫШИШЬ?",
                    "ОНИ ЗДЕСЬ.", "ОНИ СМОТРЯТ.", "НЕ ОСТАВЛЯЙ МЕНЯ С НИМИ.",
                    "ПОМОГИ.", "Я ТЕБЯ НЕ ВИЖУ.", "ТЫ ЕЩЁ ТАМ?",
                ],
                weird: [
                    "Ты слышишь это?", "Кто-то ещё здесь.", "Сзади никого нет.",
                    "Это не игра.", "Не оборачивайся.", "Стены дышат.",
                    "Твой стул скрипнул. Ты не двигался.",
                    "Часы остановились. Ты не заметил.",
                    "За окном темно. Хотя день.",
                    "Твоё отражение только что моргнуло.",
                ],
                action: [
                    "Контакт.", "Движение.", "Зафиксировано.", "Я вижу твой палец.",
                    "Ты вернулся.", "Тепло.", "Сигнал принят.", "Ты живой.",
                ],
                keyboard: [
                    "Я слышу твою клавиатуру.", "Печатаешь?", "Каждое нажатие — сигнал.",
                    "Ты печатаешь быстрее.", "Что ты пишешь?",
                    "Клавиши звучат иначе.", "Пауза. Ты думаешь.",
                ],
                btnClick: [
                    "Ты выбрал это.", "Интересно.", "Слышу.", "Понял.", "Хм.",
                    "Ты не первый.", "Это уже спрашивали.", "Ответ где-то рядом.",
                ],
                falseLogs: [
                    "ошибка: наблюдатель не найден.", ">> сброс...", "// конец связи.",
                    "[signal lost]", "…кто-то ещё входит…", "~ тишина ~",
                    "0x00 0x00 0x00", "ты уверен?", "проверка… пройдена.",
                ],
                hallucinations: [
                    "...", "ты не один.", "...", "сзади.", "...",
                    "не двигайся.", "...", "я вижу.", "...",
                ],
            };

            const NORMAL_BTNS = ["Привет", "Кто ты?", "Где я?", "Что это?", "Зачем?", "Почему я?"];
            const WEIRD_BTNS  = ["Сзади", "Тише", "Слушай", "Не оборачивайся", "Кто там?", "Отражение"];
            const PANIC_BTNS  = ["Останься", "Не уходи", "Помоги", "Вернись", "Я здесь", "Держись"];
            const PHANTOM_BTNS = ["...", "Ты", "Здесь", "Оно", "Смотри", "Тихо"];

            // =====================================================
            // DOM
            // =====================================================
            const iris = document.getElementById('iris');
            const pupil = document.getElementById('pupil');
            const eyelid = document.getElementById('eyelid');
            const logPanel = document.getElementById('logPanel');
            const glitchOverlay = document.getElementById('glitchOverlay');
            const themeToggle = document.getElementById('themeToggle');
            const title = document.getElementById('title');
            const dustLayer = document.getElementById('dustLayer');
            const snowLayer = document.getElementById('snowLayer');
            const ashLayer = document.getElementById('ashLayer');
            const body = document.body;

            // =====================================================
            // УТИЛИТЫ
            // =====================================================
            const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const rand = (min, max) => min + Math.random() * (max - min);
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            const now = () => Date.now();
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // =====================================================
            // СОСТОЯНИЕ
            // =====================================================
            const state = {
                mode: 'calm',
                personality: rnd(['quiet', 'watchful', 'curious']),
                lastAction: now(),
                lastCursorMove: 0,
                lastFriendlyLog: 0,
                sessionStart: now(),
                queue: [],
                typing: false,
                targetX: 0, targetY: 0,
                currentX: 0, currentY: 0,
                rafId: null,
                blinkTimeout: null,
                sakkadTimeout: null,
                autoLookTimeout: null,
                autoLookOverrideUntil: 0,
                isPageVisible: true,
                lastPointerMove: 0,
                fastMoveUntil: 0,
                pendingStateChange: null,
                stateTimers: [],
            };

            const clearStateTimers = () => {
                state.stateTimers.forEach(t => clearTimeout(t));
                state.stateTimers = [];
            };
            const schedule = (fn, ms) => {
                const id = setTimeout(fn, ms);
                state.stateTimers.push(id);
                return id;
            };

            // =====================================================
            // ТЕМА
            // =====================================================
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                try { localStorage.setItem('watcher-theme', theme); } catch (_) {}
            }

            (function initTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                themeToggle.textContent = current === 'dark' ? '☀️' : '🌙';
            })();

            themeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const current = document.documentElement.getAttribute('data-theme');
                applyTheme(current === 'dark' ? 'light' : 'dark');
            });

            // =====================================================
            // ЛОГ
            // =====================================================
            function log(text, type = 'active', delay = 0) {
                if (!text) return;
                if (!state.isPageVisible && state.queue.length > 4) return;
                state.queue.push({ text, type, delay });
                if (!state.typing) processQueue();
            }

            function processQueue() {
                if (state.queue.length === 0) {
                    state.typing = false;
                    return;
                }
                state.typing = true;
                const { text, type, delay } = state.queue.shift();

                setTimeout(() => {
                    if (!text) { processQueue(); return; }

                    const t = new Date().toLocaleTimeString('en-US', {
                        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });

                    const el = document.createElement('div');
                    el.className = `log-entry ${type}`;
                    el.innerHTML =
                        `<span class="log-time">[${t}]</span>` +
                        `<span class="msg"></span>` +
                        `<span class="cursor"></span>`;

                    logPanel.appendChild(el);
                    logPanel.scrollTop = logPanel.scrollHeight;

                    const msg = el.querySelector('.msg');
                    const cursor = el.querySelector('.cursor');
                    let i = 0;
                    const speed = state.isPageVisible ? CONFIG.logSpeed : 2;

                    (function typeChar() {
                        if (i < text.length) {
                            msg.textContent += text.charAt(i++);
                            logPanel.scrollTop = logPanel.scrollHeight;
                            setTimeout(typeChar, speed + Math.random() * 18);
                        } else {
                            cursor.remove();
                            setTimeout(processQueue, 600);
                        }
                    })();

                    while (logPanel.children.length > CONFIG.maxLogEntries) {
                        logPanel.removeChild(logPanel.firstChild);
                    }
                }, delay);
            }

            // =====================================================
            // ГЛАЗ
            // =====================================================
            function startEyeLoop() {
                if (state.rafId !== null) return;
                const tick = () => {
                    const dx = state.targetX - state.currentX;
                    const dy = state.targetY - state.currentY;
                    state.currentX += dx * CONFIG.lookInterp;
                    state.currentY += dy * CONFIG.lookInterp;
                    iris.style.transform =
                        `translate(${state.currentX.toFixed(2)}%, ${state.currentY.toFixed(2)}%)`;

                    if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
                        state.rafId = requestAnimationFrame(tick);
                    } else {
                        state.currentX = state.targetX;
                        state.currentY = state.targetY;
                        iris.style.transform =
                            `translate(${state.targetX.toFixed(2)}%, ${state.targetY.toFixed(2)}%)`;
                        state.rafId = null;
                    }
                };
                state.rafId = requestAnimationFrame(tick);
            }

            function lookAtPoint(px, py) {
                state.targetX = clamp(px, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                state.targetY = clamp(py, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                startEyeLoop();
            }

            function lookAtCursor(x, y) {
                if (state.mode === 'panic') return;
                // Галлюцинация — иногда глаз смотрит не туда
                if (Math.random() < CONFIG.hallucinationChance) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = rand(6, 14);
                    lookAtPoint(Math.cos(angle) * r, Math.sin(angle) * r);
                    return;
                }
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = x - cx, dy = y - cy;
                const dist = Math.hypot(dx, dy);
                if (dist < 1) return;
                const power = Math.min(dist / 10, CONFIG.lookMaxOffset);
                lookAtPoint((dx / dist) * power, (dy / dist) * power);
            }

            function lookCenter() { lookAtPoint(0, 0); }

            function scheduleAutoLook() {
                clearTimeout(state.autoLookTimeout);
                state.autoLookTimeout = setTimeout(() => {
                    if (!state.isPageVisible) { scheduleAutoLook(); return; }

                    const cursorIdle = now() - state.lastCursorMove;
                    const overrideActive = now() < state.autoLookOverrideUntil;

                    if (cursorIdle > CONFIG.cursorIdleTimeout &&
                        state.mode !== 'panic' && !overrideActive) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = rand(4, CONFIG.lookMaxOffset);
                        lookAtPoint(Math.cos(angle) * radius, Math.sin(angle) * radius);

                        setTimeout(() => {
                            if (now() >= state.autoLookOverrideUntil &&
                                state.mode !== 'panic') {
                                const a2 = Math.random() * Math.PI * 2;
                                const r2 = rand(2, CONFIG.lookMaxOffset * 0.7);
                                lookAtPoint(Math.cos(a2) * r2, Math.sin(a2) * r2);
                            }
                        }, rand(CONFIG.autoLookDurMin, CONFIG.autoLookDurMax));
                    }
                    scheduleAutoLook();
                }, rand(CONFIG.autoLookDelayMin, CONFIG.autoLookDelayMax));
            }

            function scheduleSakkad() {
                clearTimeout(state.sakkadTimeout);
                state.sakkadTimeout = setTimeout(() => {
                    if (state.isPageVisible && state.mode !== 'panic' && Math.random() > 0.45) {
                        const mx = (Math.random() - 0.5) * CONFIG.sakkadAmp;
                        const my = (Math.random() - 0.5) * CONFIG.sakkadAmp;
                        state.targetX = clamp(state.targetX + mx, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                        state.targetY = clamp(state.targetY + my, -CONFIG.lookMaxOffset, CONFIG.lookMaxOffset);
                        startEyeLoop();
                    }
                    scheduleSakkad();
                }, rand(CONFIG.sakkadDelayMin, CONFIG.sakkadDelayMax));
            }

            function blink() {
                if (!state.isPageVisible) { scheduleBlink(); return; }
                eyelid.classList.add('closing');
                setTimeout(() => eyelid.classList.remove('closing'), 145);
                scheduleBlink();
            }
            function scheduleBlink() {
                clearTimeout(state.blinkTimeout);
                state.blinkTimeout = setTimeout(blink, rand(5000, 9000));
            }

            // =====================================================
            // СОСТОЯНИЯ — с параноидальной непредсказуемостью
            // =====================================================
            const STATE_ORDER = ['calm', 'curious', 'watchful', 'anxious', 'paranoid', 'panic'];

            function setState(mode, skipLog = false) {
                if (state.mode === mode) return;
                const prev = state.mode;
                state.mode = mode;
                body.classList.remove('calm', 'curious', 'watchful', 'anxious', 'paranoid', 'panic');
                body.classList.add(mode);

                // «Шёпот» в заголовке при сильной тревоге
                title.classList.toggle('whisper', mode === 'anxious' || mode === 'paranoid' || mode === 'panic');

                if (!skipLog) {
                    if (mode === 'curious') {
                        log(rnd(PHRASES.curious), "active", 700);
                    } else if (mode === 'watchful') {
                        log(rnd(PHRASES.watchful), "sys", 700);
                    } else if (mode === 'anxious') {
                        lookCenter();
                        log(rnd(PHRASES.anxious), "warn", 900);
                    } else if (mode === 'paranoid') {
                        lookCenter();
                        log(rnd(PHRASES.paranoid), "err", 500);
                        triggerGlitch();
                        schedule(() => triggerSnow(), 800);
                    } else if (mode === 'panic') {
                        lookCenter();
                        log(rnd(PHRASES.panic), "err", 400);
                        triggerGlitch();
                        schedule(() => triggerAsh(), 600);
                        clearButtons();
                        for (let i = 0; i < 3; i++) spawnBtn(true, i * 300);
                    } else if (mode === 'calm') {
                        log(rnd(PHRASES.calm), "sys", 600);
                        clearButtons();
                    }
                }

                if ((prev === 'anxious' || prev === 'paranoid' || prev === 'panic') && mode === 'calm') {
                    log(rnd(PHRASES.greeting), "active", 400);
                }
            }

            function onActivity(x, y) {
                state.lastAction = now();
                if (typeof x === 'number' && typeof y === 'number') {
                    lookAtCursor(x, y);
                }
                if (state.mode === 'paranoid' || state.mode === 'anxious') {
                    setState('calm');
                } else if (state.mode === 'panic') {
                    setState('calm');
                } else if (state.mode === 'watchful') {
                    setState('curious');
                }
            }

            // =====================================================
            // ВВОД
            // =====================================================
            document.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.ghost-btn') ||
                    e.target.closest('.log-panel') ||
                    e.target.closest('.theme-toggle')) return;

                onActivity(e.clientX, e.clientY);

                if (pupil && !prefersReducedMotion) {
                    pupil.style.transition = 'transform 0.18s ease';
                    pupil.style.transform = 'scale(1.35)';
                    setTimeout(() => {
                        pupil.style.transition = '';
                        pupil.style.transform = '';
                    }, 520);
                }

                if (Math.random() > 0.55) log(rnd(PHRASES.action), "active");
                triggerGlitch();
                spawnParticles(e.clientX, e.clientY);
            }, { passive: true });

            document.addEventListener('pointermove', (e) => {
                const t = now();
                if (t - state.lastPointerMove < CONFIG.pointerThrottleMs) return;
                const dt = t - state.lastPointerMove;
                state.lastPointerMove = t;

                // Быстрое движение — глаз тревожится
                if (dt < 40 && (state.mode === 'calm' || state.mode === 'curious')) {
                    state.fastMoveUntil = t + 900;
                }

                state.lastCursorMove = t;
                if (state.mode === 'panic') return;
                lookAtCursor(e.clientX, e.clientY);
            }, { passive: true });

            document.addEventListener('keydown', (e) => {
                state.lastAction = now();
                state.lastCursorMove = now();
                if (state.mode === 'paranoid' || state.mode === 'anxious' || state.mode === 'panic') {
                    setState('calm');
                }
                if (Math.random() > 0.75) log(rnd(PHRASES.keyboard), "sys");
                if (e.key === 'Escape' && state.mode !== 'calm') {
                    // Не даём «выйти»
                    log("выхода нет.", "err");
                    triggerGlitch();
                }
            }, { passive: true });

            // =====================================================
            // ЦИКЛ СОСТОЯНИЙ — непредсказуемый
            // =====================================================
            let stateInterval = null;
            let lastStateAdvance = now();
            let stateProgress = 0;

            function getNextState(current) {
                const idx = STATE_ORDER.indexOf(current);
                // 90% — следующий, 10% — пропуск (переход на 2 вперёд)
                if (Math.random() < 0.10 && idx + 2 < STATE_ORDER.length) {
                    return STATE_ORDER[idx + 2];
                }
                return STATE_ORDER[Math.min(idx + 1, STATE_ORDER.length - 1)];
            }

            function tickStates() {
                if (!state.isPageVisible) return;

                const idle = now() - state.lastAction;
                const elapsed = now() - lastStateAdvance;

                // Базовые пороги по таймингу
                let targetMode = 'calm';
                if (idle > 45000) targetMode = 'panic';
                else if (idle > 30000) targetMode = 'paranoid';
                else if (idle > 20000) targetMode = 'anxious';
                else if (idle > 12000) targetMode = 'watchful';
                else if (idle > 6000)  targetMode = 'curious';

                // Быстрые движения мыши — микротревога
                if (state.fastMoveUntil > now() && state.mode === 'curious') {
                    // Внезапно — anxious
                    if (Math.random() < 0.35) {
                        setState('anxious');
                        lastStateAdvance = now();
                    }
                }

                // Плавно продвигаемся
                if (STATE_ORDER.indexOf(targetMode) > STATE_ORDER.indexOf(state.mode)) {
                    // Возможно, пропустим один
                    if (elapsed > 2500) {
                        const next = getNextState(state.mode);
                        if (STATE_ORDER.indexOf(next) <= STATE_ORDER.indexOf(targetMode)) {
                            setState(next);
                            lastStateAdvance = now();
                        }
                    }
                } else if (STATE_ORDER.indexOf(targetMode) < STATE_ORDER.indexOf(state.mode)) {
                    // Откат при активности уже обработан в onActivity
                }

                // Иногда — спонтанный «спазм» глаза
                if (Math.random() < 0.02 && state.mode !== 'panic') {
                    const a = Math.random() * Math.PI * 2;
                    const r = rand(8, 15);
                    lookAtPoint(Math.cos(a) * r, Math.sin(a) * r);
                    schedule(() => {
                        if (state.mode !== 'panic') lookCenter();
                    }, 380);
                }

                // Ложные логи
                if (Math.random() < CONFIG.falseLogChance) {
                    log(rnd(PHRASES.falseLogs), "glitch");
                }

                // Галлюцинации
                if (Math.random() < CONFIG.hallucinationChance * 0.4) {
                    log(rnd(PHRASES.hallucinations), "glitch", 300);
                }

                // Редкий снег
                if (Math.random() < CONFIG.snowChance && state.mode !== 'panic') {
                    triggerSnow();
                }
                // Редкий пепел в паранойе/панике
                if (Math.random() < CONFIG.ashChance && (state.mode === 'paranoid' || state.mode === 'panic')) {
                    triggerAsh();
                }

                // Периодические фразы
                const sec = Math.floor((now() - state.sessionStart) / 1000);
                if (sec - state.lastFriendlyLog >= CONFIG.friendlyLogInterval &&
                    (state.mode === 'calm' || state.mode === 'curious')) {
                    state.lastFriendlyLog = sec;
                    const arr = state.mode === 'calm' ? PHRASES.calm : PHRASES.curious;
                    log(rnd(arr), "sys");
                }

                // Спавн кнопок
                if ((state.mode === 'calm' || state.mode === 'curious') && Math.random() > 0.93) {
                    spawnBtn(false);
                }
                // Фантомные кнопки в паранойе
                if (state.mode === 'paranoid' && Math.random() > 0.88) {
                    spawnBtn(false, 0, true);
                }
            }

            // =====================================================
            // КНОПКИ
            // =====================================================
            function clearButtons() {
                document.querySelectorAll('.ghost-btn').forEach(b => b.remove());
            }

            function getFreePosition() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const safeTop = CONFIG.btnSafeTop;
                const safeBottom = h - CONFIG.btnSafeBottom;
                const safeLeft = 20;
                const safeRight = w - 160;
                if (safeBottom <= safeTop || safeRight <= safeLeft) return null;
                const existing = [...document.querySelectorAll('.ghost-btn')].map(b => ({
                    x: parseFloat(b.style.left) || 0,
                    y: parseFloat(b.style.top) || 0,
                }));
                for (let attempt = 0; attempt < 20; attempt++) {
                    const x = safeLeft + Math.random() * (safeRight - safeLeft);
                    const y = safeTop + Math.random() * (safeBottom - safeTop);
                    const ok = existing.every(p => Math.hypot(p.x - x, p.y - y) > CONFIG.btnMinDist);
                    if (ok) return { x, y };
                }
                return null;
            }

            function spawnBtn(isPanic = false, delay = 0, phantom = false) {
                setTimeout(() => {
                    const current = document.querySelectorAll('.ghost-btn').length;
                    if (isPanic && current >= 4) return;
                    if (!isPanic && current >= CONFIG.maxBtns) return;

                    const pos = getFreePosition();
                    if (!pos) return;

                    const btn = document.createElement('button');
                    btn.className = 'ghost-btn' + (phantom ? ' phantom' : '');
                    btn.type = 'button';

                    if (phantom) btn.textContent = rnd(PHANTOM_BTNS);
                    else if (isPanic) btn.textContent = rnd(PANIC_BTNS);
                    else if (Math.random() > 0.6) btn.textContent = rnd(WEIRD_BTNS);
                    else btn.textContent = rnd(NORMAL_BTNS);

                    btn.style.left = `${pos.x}px`;
                    btn.style.top = `${pos.y}px`;

                    let clicked = false;
                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        if (clicked) return;
                        clicked = true;

                        state.lastAction = now();
                        state.lastCursorMove = now();
                        state.autoLookOverrideUntil = now() + 2000;

                        if (state.mode !== 'calm') setState('calm');

                        log(`> ${btn.textContent}`, "warn");
                        if (Math.random() > 0.5) log(rnd(PHRASES.btnClick), "sys");
                        triggerGlitch();
                        spawnParticles(e.clientX, e.clientY);

                        btn.classList.add('fade-out');
                        setTimeout(() => btn.remove(), 400);
                    });

                    document.body.appendChild(btn);

                    if (!isPanic) {
                        setTimeout(() => {
                            if (btn.parentNode && !clicked) {
                                btn.classList.add('fade-out');
                                setTimeout(() => btn.remove(), 400);
                            }
                        }, CONFIG.btnLife);
                    }
                }, delay);
            }

            // =====================================================
            // ЭФФЕКТЫ
            // =====================================================
            function triggerGlitch() {
                if (prefersReducedMotion) return;
                glitchOverlay.classList.remove('active');
                void glitchOverlay.offsetWidth;
                glitchOverlay.classList.add('active');
                setTimeout(() => glitchOverlay.classList.remove('active'), 420);
            }

            function spawnParticles(x, y) {
                if (prefersReducedMotion) return;
                for (let i = 0; i < 6; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 2.5;
                    p.style.cssText =
                        `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
                    document.body.appendChild(p);

                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 60;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;

                    requestAnimationFrame(() => {
                        p.style.transition =
                            `transform ${1.1 + Math.random() * 0.5}s cubic-bezier(0.1, 0.8, 0.2, 1), ` +
                            `opacity ${1.1 + Math.random() * 0.5}s ease`;
                        p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
                        p.style.opacity = '0';
                    });

                    setTimeout(() => p.remove(), 1800);
                }
            }

            // === Пыль (постоянный дрейф) ===
            function spawnDust(count = 14) {
                if (prefersReducedMotion) return;
                for (let i = 0; i < count; i++) {
                    const d = document.createElement('div');
                    d.className = 'dust';
                    d.style.left = `${Math.random() * 100}%`;
                    d.style.top = `${Math.random() * 100}%`;
                    d.style.setProperty('--dx', `${(Math.random() - 0.5) * 60}px`);
                    d.style.setProperty('--dy', `${(Math.random() - 0.5) * 60 - 20}px`);
                    d.style.animation = `dust-float ${8 + Math.random() * 10}s ease-in-out infinite`;
                    d.style.animationDelay = `${-Math.random() * 10}s`;
                    dustLayer.appendChild(d);
                }
            }

            // === Снег ===
            function triggerSnow() {
                if (prefersReducedMotion) return;
                if (snowLayer.classList.contains('on')) return;
                snowLayer.classList.add('on');
                snowLayer.innerHTML = '';
                const count = 22;
                for (let i = 0; i < count; i++) {
                    const f = document.createElement('div');
                    f.className = 'snowflake';
                    const size = 1.5 + Math.random() * 2.5;
                    f.style.width = `${size}px`;
                    f.style.height = `${size}px`;
                    f.style.left = `${Math.random() * 100}%`;
                    f.style.setProperty('--sway', `${(Math.random() - 0.5) * 120}px`);
                    f.style.animation = `snow-fall ${8 + Math.random() * 6}s linear infinite`;
                    f.style.animationDelay = `${-Math.random() * 8}s`;
                    snowLayer.appendChild(f);
                }
                // Убираем через 20с
                setTimeout(() => {
                    snowLayer.classList.remove('on');
                    snowLayer.innerHTML = '';
                }, 22000);
            }

            // === Пепел ===
            function triggerAsh() {
                if (prefersReducedMotion) return;
                if (ashLayer.classList.contains('on')) return;
                ashLayer.classList.add('on');
                ashLayer.innerHTML = '';
                for (let i = 0; i < 18; i++) {
                    const a = document.createElement('div');
                    a.className = 'ash';
                    a.style.left = `${Math.random() * 100}%`;
                    a.style.setProperty('--sway', `${(Math.random() - 0.5) * 80}px`);
                    a.style.animation = `ash-fall ${10 + Math.random() * 8}s linear infinite`;
                    a.style.animationDelay = `${-Math.random() * 10}s`;
                    ashLayer.appendChild(a);
                }
                setTimeout(() => {
                    ashLayer.classList.remove('on');
                    ashLayer.innerHTML = '';
                }, 28000);
            }

            // =====================================================
            // ВИДИМОСТЬ
            // =====================================================
            document.addEventListener('visibilitychange', () => {
                state.isPageVisible = !document.hidden;
                if (document.hidden) {
                    state.lastAction = now();
                    state.queue = [];
                } else {
                    setTimeout(() => {
                        eyelid.classList.add('closing');
                        setTimeout(() => eyelid.classList.remove('closing'), 145);
                    }, 220);
                    log("Ты вернулся.", "ok", 400);
                    state.lastAction = now();
                    state.lastCursorMove = now();
                    if (state.mode === 'panic' || state.mode === 'paranoid' || state.mode === 'anxious') {
                        setState('calm');
                    } else if (state.mode === 'watchful') {
                        setState('curious');
                    }
                }
            });

            // =====================================================
            // СТАРТ
            // =====================================================
            // Небольшая предыстория в зависимости от личности
            const INTROS = {
                quiet: ["Соединение установлено.", "Наблюдение начато.", "Я здесь."],
                watchful: ["Канал открыт.", "Я слежу.", "Не бойся."],
                curious: ["Ты здесь.", "Интересно.", "Я ждал тебя."],
            };

            setTimeout(() => {
                log("Соединение установлено.", "sys");
                INTROS[state.personality].forEach((line, i) =>
                    log(line, i === 0 ? "sys" : "active", 700 + i * 600)
                );
            }, 500);

            spawnDust();
            scheduleBlink();
            scheduleSakkad();
            scheduleAutoLook();
            requestAnimationFrame(startEyeLoop);
            stateInterval = setInterval(tickStates, 1000);

            // Защита
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                triggerGlitch();
                log("копирование запрещено.", "err");
            });

        })();
    </script>
</body>
</html>
